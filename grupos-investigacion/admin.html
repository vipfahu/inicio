<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Panel · Grupos y Programas Centro · FAHU USACH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&amp;family=Spectral:ital,wght@0,400;0,600;1,400&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../comun/vip.css?v=20261104">
<style>
  :root{--acento:#7A4FA3}
  body{background:#F1EFE8}
  .adm-cab{background:var(--tinta);padding:12px clamp(16px,5vw,48px);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
  .adm-cab img{height:44px;filter:brightness(0) invert(1);display:block}
  .adm-cab .quien{font:600 12px Archivo,sans-serif;color:rgba(255,255,255,.8)}
  .adm-cab .btn.sec{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
  .adm-cab .btn.sec:hover{border-color:#fff;color:#fff}
  .login{max-width:420px;margin:clamp(24px,8vh,80px) auto;padding:0 16px}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--borde);border-radius:12px;overflow:hidden;font:400 13px Archivo,sans-serif}
  th{text-align:left;font:600 11px Archivo,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--apagado);background:#FAF9F5;padding:10px 12px;border-bottom:1px solid var(--borde)}
  td{padding:10px 12px;border-bottom:1px solid #F0EDE4;vertical-align:top}
  tr:last-child td{border-bottom:0}
  .marca{font:600 12px 'IBM Plex Mono',monospace}
  .marca.si{color:var(--ok)} .marca.no{color:#C9C2B2}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .docfila{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;padding:10px 0;border-top:1px solid #F0EDE4;font:400 13px Archivo,sans-serif}
  .docfila small{color:var(--apagado)}
  .tabla-scroll{overflow-x:auto}
  @media screen and (max-width:760px){ .ocultar-movil{display:none} }
</style>
</head>
<body>
<div class="adm-cab">
  <a href="/" title="Ir al portal" style="line-height:0"><img src="assets/logo-fahu.png" alt="Facultad de Humanidades · USACH"></a>
  <div class="acciones" id="cabAcciones" style="width:auto"></div>
</div>
<main id="app"><p class="nota">Cargando…</p></main>

<script type="module">
import { conectar, esc, urlSegura, fechaLarga, avisar, traducir, modal, cerrarModal, verArchivo, nivelEn, anotar, rutaArchivo } from "../comun/vip.js?v=20261104";

const PLATAFORMA = "grupos";
const TIPOS_DOC = [["creacion","Resolución de creación"],["modificacion","Resolución de modificación"],["normativa_interna","Normativa interna"],["integrantes","Resolución de integrantes"],["otro","Otro documento"]];
const TIPO_REF = [["reglamento","Reglamento interno"],["modelo","Modelo de resolución"],["otro","Documento de referencia"]];
const rotDoc = t => (TIPOS_DOC.find(x => x[0] === t) || [, t])[1];
const app = document.getElementById("app");
const st = { pestana: "inst", inst: [], docs: [], refs: [], actividad: [], nivel: "ninguno", perfil: null };
let sb, cfg;
const puede = () => st.nivel === "edicion" || st.nivel === "administracion";

function cabecera(sesion) {
  document.getElementById("cabAcciones").innerHTML =
    '<a class="btn sec chico" href="index.html">Ver catálogo</a>' +
    (sesion ? '<span class="quien">' + esc(sesion.user.email) + '</span><button class="btn sec chico" id="salir">Cerrar sesión</button>' : "");
  const s = document.getElementById("salir");
  if (s) s.onclick = async () => { await sb.auth.signOut(); iniciar(); };
}

function pantallaLogin(mensaje) {
  cabecera(null);
  app.innerHTML = '<div class="login"><div class="caja">' +
    '<div class="kicker">Grupos y Programas Centro</div><h1 style="font-size:24px">Panel de actualización</h1>' +
    (mensaje ? '<div class="aviso ' + (mensaje.tipo || "err") + '">' + esc(mensaje.texto) + "</div>" : "") +
    '<form id="fLogin"><div class="campo"><label for="correo">Correo</label><input id="correo" type="email" autocomplete="username" required placeholder="nombre@usach.cl"></div>' +
    '<div class="campo"><label for="clave">Contraseña</label><input id="clave" type="password" autocomplete="current-password" required></div>' +
    '<button class="btn" style="width:100%" type="submit">Ingresar</button></form>' +
    '<p class="nota" style="margin-top:14px">Usa la misma cuenta de los otros paneles del portal. <button class="btn sec chico" id="olvide" type="button">Olvidé mi contraseña</button></p>' +
    '<p class="nota">El acceso a esta plataforma se asigna en la matriz «Acceso por plataforma» de la pestaña Usuarios de cualquier panel (Normativa, Cursos o Trayectorias).</p>' +
    "</div></div>";
  document.getElementById("fLogin").onsubmit = async e => {
    e.preventDefault();
    const { error } = await sb.auth.signInWithPassword({ email: document.getElementById("correo").value.trim(), password: document.getElementById("clave").value });
    if (error) { pantallaLogin({ texto: traducir(error.message) }); return; }
    iniciar();
  };
  document.getElementById("olvide").onclick = async () => {
    const correo = document.getElementById("correo").value.trim();
    if (!correo) { avisar("Escribe tu correo arriba y vuelve a presionar.", "err"); return; }
    const { error } = await sb.auth.resetPasswordForEmail(correo, { redirectTo: location.origin + location.pathname });
    avisar(error ? traducir(error.message) : "Si el correo tiene cuenta, recibirás un enlace para crear una contraseña nueva.", error ? "err" : "ok");
  };
}

function pantallaNuevaClave() {
  app.innerHTML = '<div class="login"><div class="caja"><h1 style="font-size:22px">Crea tu contraseña nueva</h1>' +
    '<form id="fClave"><div class="campo"><label for="nueva">Contraseña nueva (mínimo 8 caracteres)</label><input id="nueva" type="password" minlength="8" autocomplete="new-password" required></div>' +
    '<button class="btn" type="submit">Guardar</button></form></div></div>';
  document.getElementById("fClave").onsubmit = async e => {
    e.preventDefault();
    const { error } = await sb.auth.updateUser({ password: document.getElementById("nueva").value });
    if (error) { avisar(traducir(error.message), "err"); return; }
    avisar("Contraseña actualizada.");
    history.replaceState(null, "", location.pathname);
    iniciar();
  };
}

async function cargar() {
  const [i, d, r, a] = await Promise.all([
    sb.from("gi_instancias").select("*").order("nombre"),
    sb.from("gi_documentos").select("*").order("fecha", { ascending: false }),
    sb.from("gi_referencias").select("*").order("orden").order("titulo"),
    sb.from("actividad").select("*").like("accion", "GI:%").order("fecha", { ascending: false }).limit(50)
  ]);
  const err = i.error || d.error || r.error;
  if (err) throw err;
  st.inst = i.data; st.docs = d.data; st.refs = r.data; st.actividad = a.error ? [] : a.data;
}

function pintar() {
  const tabs = [["inst", "Grupos y programas centro"], ["refs", "Reglamentos y modelos"], ["act", "Actividad"]];
  app.innerHTML =
    '<div class="kicker">Panel de actualización · ' + (puede() ? (st.nivel === "administracion" ? "Administración" : "Edición") : "Consulta") + '</div>' +
    '<h1>Grupos y Programas Centro de Investigación</h1>' +
    (puede() ? "" : '<div class="aviso av">Tu acceso es de consulta: puedes revisar, pero no modificar.</div>') +
    '<div class="pestanas" role="tablist">' + tabs.map(([id, rot]) => '<button role="tab" aria-selected="' + (st.pestana === id) + '" data-tab="' + id + '">' + rot + "</button>").join("") + "</div>" +
    '<div id="contenido"></div>';
  app.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { st.pestana = b.dataset.tab; pintar(); });
  const c = document.getElementById("contenido");
  if (st.pestana === "inst") c.innerHTML = vistaInstancias();
  else if (st.pestana === "refs") c.innerHTML = vistaRefs();
  else c.innerHTML = vistaActividad();
}

function vistaInstancias() {
  const tiposCols = TIPOS_DOC.slice(0, 4);
  const filas = st.inst.map(i => {
    const ds = st.docs.filter(d => d.instancia === i.id);
    return "<tr><td><b>" + esc(i.nombre) + "</b>" + (i.sigla ? " (" + esc(i.sigla) + ")" : "") + '<br><span class="nota">' + esc(i.unidad || "") + "</span></td>" +
      "<td>" + (i.tipo === "programa_centro" ? '<span class="etq nar">Programa centro</span>' : '<span class="etq teal">Grupo</span>') + (i.vigente ? "" : '<br><span class="etq gris">No vigente</span>') + "</td>" +
      tiposCols.map(([t]) => { const n = ds.filter(d => d.tipo === t).length; return '<td class="ocultar-movil"><span class="marca ' + (n ? "si" : "no") + '">' + (n ? "✓ " + n : "—") + "</span></td>"; }).join("") +
      '<td style="white-space:nowrap"><button class="btn sec chico" data-docs="' + i.id + '">Documentos</button> ' +
      (puede() ? '<button class="btn sec chico" data-editar="' + i.id + '">Editar</button>' : "") + "</td></tr>";
  }).join("");
  return '<div class="bar"><p class="nota" style="margin:0">' + st.inst.length + " instancias · " + st.docs.length + " documentos</p>" +
    (puede() ? '<button class="btn" data-nueva>+ Nueva instancia</button>' : "") + "</div>" +
    (st.inst.length
      ? '<div class="tabla-scroll"><table><thead><tr><th>Nombre</th><th>Tipo</th>' + tiposCols.map(([, r]) => '<th class="ocultar-movil">' + r.replace("Resolución de ", "Res. ") + "</th>").join("") + "<th></th></tr></thead><tbody>" + filas + "</tbody></table></div>"
      : '<div class="vacio">Aún no hay instancias. ' + (puede() ? "Crea la primera con «Nueva instancia»." : "") + "</div>");
}

function vistaRefs() {
  return '<div class="bar"><p class="nota" style="margin:0">Se muestran en el catálogo público, en el orden indicado.</p>' + (puede() ? '<button class="btn" data-nueva-ref>+ Agregar documento de referencia</button>' : "") + "</div>" +
    (st.refs.length ? '<div class="tabla-scroll"><table><thead><tr><th>Orden</th><th>Documento</th><th>Tipo</th><th></th></tr></thead><tbody>' +
      st.refs.map(r => '<tr><td class="marca">' + r.orden + "</td><td><b>" + esc(r.titulo) + "</b>" + (r.descripcion ? '<br><span class="nota">' + esc(r.descripcion) + "</span>" : "") + "</td><td>" +
        esc((TIPO_REF.find(x => x[0] === r.tipo) || [, r.tipo])[1]) + '</td><td style="white-space:nowrap">' +
        (urlSegura(r.pdf) ? '<button class="btn sec chico" data-ver="' + esc(r.pdf) + '" data-titulo="' + esc(r.titulo) + '">Ver</button> ' : urlSegura(r.enlace) ? '<a class="btn sec chico" href="' + esc(r.enlace) + '" target="_blank" rel="noopener">Abrir ↗</a> ' : "") +
        (puede() ? '<button class="btn sec chico" data-editar-ref="' + r.id + '">Editar</button>' : "") + "</td></tr>").join("") + "</tbody></table></div>"
      : '<div class="vacio">Sin documentos de referencia. Puedes cargar los reglamentos internos y los modelos de resolución (PDF o enlace a la página de Investigación FAHU).</div>');
}

function vistaActividad() {
  if (!st.actividad.length) return '<div class="vacio">Sin actividad registrada en este módulo.</div>';
  return '<div class="tabla-scroll"><table><thead><tr><th>Fecha</th><th>Cuenta</th><th>Acción</th></tr></thead><tbody>' +
    st.actividad.map(a => '<tr><td class="marca" style="white-space:nowrap">' + esc(String(a.fecha || a.creado || "").slice(0, 16).replace("T", " ")) + "</td><td>" + esc(a.correo) + "</td><td>" + esc(String(a.accion).replace(/^GI: /, "")) + (a.detalle ? '<br><span class="nota">' + esc(a.detalle) + "</span>" : "") + "</td></tr>").join("") +
    "</tbody></table></div>";
}

/* ---------- Instancias ---------- */
function formInstancia(i) {
  i = i || { tipo: "grupo", vigente: true };
  const m = modal('<h2>' + (i.id ? "Editar instancia" : "Nueva instancia") + '</h2><form id="fInst">' +
    '<div class="fila2"><div class="campo"><label for="tipo">Tipo</label><select id="tipo"><option value="grupo"' + (i.tipo === "grupo" ? " selected" : "") + '>Grupo</option><option value="programa_centro"' + (i.tipo === "programa_centro" ? " selected" : "") + '>Programa centro de investigación</option></select></div>' +
    '<div class="campo"><label for="sigla">Sigla</label><input id="sigla" value="' + esc(i.sigla) + '"></div></div>' +
    '<div class="campo"><label for="nombre">Nombre *</label><input id="nombre" required value="' + esc(i.nombre) + '"></div>' +
    '<div class="fila2"><div class="campo"><label for="unidad">Unidad</label><input id="unidad" list="unidades" value="' + esc(i.unidad) + '"></div>' +
    '<div class="campo"><label for="responsable">Responsable</label><input id="responsable" value="' + esc(i.responsable) + '"></div></div>' +
    '<datalist id="unidades">' + [...new Set(st.inst.map(x => x.unidad).filter(Boolean))].map(u => "<option>" + esc(u) + "</option>").join("") + "</datalist>" +
    '<div class="campo"><label for="descripcion">Descripción</label><textarea id="descripcion">' + esc(i.descripcion) + "</textarea></div>" +
    '<div class="campo"><label for="lineas">Líneas de trabajo</label><input id="lineas" value="' + esc(i.lineas) + '"></div>' +
    '<div class="fila2"><div class="campo"><label for="contacto">Contacto</label><input id="contacto" value="' + esc(i.contacto) + '"></div>' +
    '<div class="campo"><label for="sitio">Sitio web (https://…)</label><input id="sitio" type="url" value="' + esc(i.sitio) + '"></div></div>' +
    '<label class="check"><input type="checkbox" id="vigente"' + (i.vigente ? " checked" : "") + "> Vigente</label>" +
    '<div class="pie">' + (i.id ? '<button class="btn peligro" type="button" id="borrar">Eliminar</button>' : "") + '<button class="btn sec" type="button" id="cancelar">Cancelar</button><button class="btn" type="submit">Guardar</button></div></form>');
  m.querySelector("#cancelar").onclick = cerrarModal;
  m.querySelector("#fInst").onsubmit = async e => {
    e.preventDefault();
    const v = id => m.querySelector("#" + id).value.trim() || null;
    const fila = { tipo: v("tipo"), nombre: v("nombre"), sigla: v("sigla"), unidad: v("unidad"), responsable: v("responsable"), descripcion: v("descripcion"), lineas: v("lineas"), contacto: v("contacto"), sitio: v("sitio"), vigente: m.querySelector("#vigente").checked };
    if (fila.sitio && !urlSegura(fila.sitio)) { avisar("El sitio debe empezar con https://", "err"); return; }
    const r = i.id ? await sb.from("gi_instancias").update(fila).eq("id", i.id) : await sb.from("gi_instancias").insert(fila);
    if (r.error) { avisar(traducir(r.error.message), "err"); return; }
    await anotar(sb, "GI: ", i.id ? "Instancia editada" : "Instancia creada", fila.nombre);
    cerrarModal(); avisar("Guardado."); await recargar();
  };
  const b = m.querySelector("#borrar");
  if (b) b.onclick = async () => {
    if (st.docs.some(d => d.instancia === i.id)) { avisar("Primero elimina sus documentos (o márcala como no vigente).", "err"); return; }
    if (!confirm("¿Eliminar «" + i.nombre + "»? No se puede deshacer.")) return;
    const r = await sb.from("gi_instancias").delete().eq("id", i.id);
    if (r.error) { avisar(traducir(r.error.message), "err"); return; }
    await anotar(sb, "GI: ", "Instancia eliminada", i.nombre);
    cerrarModal(); avisar("Eliminada."); await recargar();
  };
}

/* ---------- Documentos de una instancia ---------- */
function rutaDesdeUrl(url) {
  const m = /\/storage\/v1\/object\/public\/grupos\/(.+)$/.exec(String(url || ""));
  return m ? decodeURIComponent(m[1]) : null;
}

function verDocumentos(id) {
  const i = st.inst.find(x => x.id === id);
  const ds = st.docs.filter(d => d.instancia === id);
  const lista = TIPOS_DOC.map(([t, rot]) => {
    const dt = ds.filter(d => d.tipo === t);
    if (!dt.length && t === "otro") return "";
    return '<h3 style="margin-top:14px">' + rot + "</h3>" + (dt.length ? dt.map(d =>
      '<div class="docfila"><span>' + esc(d.titulo || rot) + (d.vigente ? "" : ' <span class="etq gris">Anterior</span>') + "<br><small>" + esc([d.numero ? "N° " + d.numero : "", fechaLarga(d.fecha), d.nota].filter(Boolean).join(" · ")) + "</small></span>" +
      '<span style="white-space:nowrap">' + (urlSegura(d.pdf) ? '<button class="btn sec chico" data-ver="' + esc(d.pdf) + '" data-titulo="' + esc(d.titulo || rot) + '">Ver</button> ' : urlSegura(d.enlace) ? '<a class="btn sec chico" href="' + esc(d.enlace) + '" target="_blank" rel="noopener">Abrir ↗</a> ' : "") +
      (puede() ? '<button class="btn sec chico" data-editar-doc="' + d.id + '">Editar</button>' : "") + "</span></div>").join("")
      : '<p class="nota" style="margin:4px 0">' + (t === "modificacion" ? "Sin modificaciones (si corresponde)." : "Sin registrar.") + "</p>");
  }).join("");
  const m = modal('<div class="kicker">Documentos</div><h2>' + esc(i.nombre) + "</h2>" + lista +
    '<div class="pie">' + (puede() ? '<button class="btn" id="agregarDoc">+ Agregar documento</button>' : "") + '<button class="btn sec" id="cerrar">Cerrar</button></div>');
  m.querySelector("#cerrar").onclick = cerrarModal;
  const a = m.querySelector("#agregarDoc");
  if (a) a.onclick = () => formDocumento({ instancia: id, tipo: "creacion", vigente: true });
}

function formDocumento(d) {
  const i = st.inst.find(x => x.id === d.instancia);
  const m = modal('<div class="kicker">' + esc(i.nombre) + "</div><h2>" + (d.id ? "Editar documento" : "Agregar documento") + '</h2><form id="fDoc">' +
    '<div class="campo"><label for="tipo">Tipo *</label><select id="tipo">' + TIPOS_DOC.map(([t, r]) => '<option value="' + t + '"' + (d.tipo === t ? " selected" : "") + ">" + r + "</option>").join("") + "</select></div>" +
    '<div class="campo"><label for="titulo">Título (opcional; si queda vacío se usa el tipo)</label><input id="titulo" value="' + esc(d.titulo) + '"></div>' +
    '<div class="fila2"><div class="campo"><label for="numero">N° de resolución</label><input id="numero" value="' + esc(d.numero) + '"></div>' +
    '<div class="campo"><label for="fecha">Fecha</label><input id="fecha" type="date" value="' + esc(d.fecha) + '"></div></div>' +
    '<div class="campo"><label for="archivo">Archivo PDF' + (urlSegura(d.pdf) ? " (ya cargado; sube otro solo para reemplazarlo)" : "") + '</label><input id="archivo" type="file" accept="application/pdf"></div>' +
    '<div class="campo"><label for="enlace">o enlace (https://…)</label><input id="enlace" type="url" value="' + esc(d.enlace) + '"></div>' +
    '<div class="campo"><label for="nota">Nota</label><input id="nota" value="' + esc(d.nota) + '"></div>' +
    '<label class="check"><input type="checkbox" id="vigente"' + (d.vigente ? " checked" : "") + '> Vigente (desmarca cuando lo reemplace uno nuevo; queda como «Anterior»)</label>' +
    '<div class="pie">' + (d.id ? '<button class="btn peligro" type="button" id="borrar">Eliminar</button>' : "") + '<button class="btn sec" type="button" id="volver">Volver</button><button class="btn" type="submit" id="guardar">Guardar</button></div></form>');
  m.querySelector("#volver").onclick = () => verDocumentos(d.instancia);
  m.querySelector("#fDoc").onsubmit = async e => {
    e.preventDefault();
    const g = m.querySelector("#guardar"); g.disabled = true; g.textContent = "Guardando…";
    try {
      const v = id => m.querySelector("#" + id).value.trim() || null;
      const fila = { instancia: d.instancia, tipo: v("tipo"), titulo: v("titulo"), numero: v("numero"), fecha: v("fecha"), enlace: v("enlace"), nota: v("nota"), vigente: m.querySelector("#vigente").checked };
      if (fila.enlace && !urlSegura(fila.enlace)) throw new Error("El enlace debe empezar con https://");
      const f = m.querySelector("#archivo").files[0];
      if (f) {
        if (f.type !== "application/pdf") throw new Error("El archivo debe ser PDF.");
        if (f.size > 25 * 1024 * 1024) throw new Error("El PDF supera 25 MB.");
        const ruta = rutaArchivo(String(d.instancia), f.name);
        const up = await sb.storage.from(cfg.BUCKET).upload(ruta, f, { contentType: "application/pdf", upsert: false });
        if (up.error) throw up.error;
        fila.pdf = sb.storage.from(cfg.BUCKET).getPublicUrl(ruta).data.publicUrl;
      }
      if (!fila.pdf && !d.pdf && !fila.enlace) throw new Error("Carga un PDF o indica un enlace.");
      const r = d.id ? await sb.from("gi_documentos").update(fila).eq("id", d.id) : await sb.from("gi_documentos").insert(fila);
      if (r.error) throw r.error;
      if (f && d.pdf) { const vieja = rutaDesdeUrl(d.pdf); if (vieja) await sb.storage.from(cfg.BUCKET).remove([vieja]); }
      await anotar(sb, "GI: ", d.id ? "Documento editado" : "Documento agregado", i.nombre + " · " + rotDoc(fila.tipo));
      avisar("Documento guardado."); await recargar(); verDocumentos(d.instancia);
    } catch (err) { avisar(traducir(err.message), "err"); g.disabled = false; g.textContent = "Guardar"; }
  };
  const b = m.querySelector("#borrar");
  if (b) b.onclick = async () => {
    if (!confirm("¿Eliminar este documento y su archivo? No se puede deshacer.")) return;
    const r = await sb.from("gi_documentos").delete().eq("id", d.id);
    if (r.error) { avisar(traducir(r.error.message), "err"); return; }
    const ruta = rutaDesdeUrl(d.pdf); if (ruta) await sb.storage.from(cfg.BUCKET).remove([ruta]);
    await anotar(sb, "GI: ", "Documento eliminado", i.nombre + " · " + rotDoc(d.tipo));
    avisar("Eliminado."); await recargar(); verDocumentos(d.instancia);
  };
}

/* ---------- Reglamentos y modelos ---------- */
function formRef(r) {
  r = r || { tipo: "reglamento", orden: st.refs.length + 1 };
  const m = modal("<h2>" + (r.id ? "Editar" : "Agregar") + ' documento de referencia</h2><form id="fRef">' +
    '<div class="fila2"><div class="campo"><label for="tipo">Tipo</label><select id="tipo">' + TIPO_REF.map(([t, x]) => '<option value="' + t + '"' + (r.tipo === t ? " selected" : "") + ">" + x + "</option>").join("") + "</select></div>" +
    '<div class="campo"><label for="orden">Orden</label><input id="orden" type="number" value="' + esc(r.orden) + '"></div></div>' +
    '<div class="campo"><label for="titulo">Título *</label><input id="titulo" required value="' + esc(r.titulo) + '"></div>' +
    '<div class="campo"><label for="descripcion">Descripción</label><input id="descripcion" value="' + esc(r.descripcion) + '"></div>' +
    '<div class="campo"><label for="archivo">Archivo PDF' + (urlSegura(r.pdf) ? " (ya cargado)" : "") + '</label><input id="archivo" type="file" accept="application/pdf"></div>' +
    '<div class="campo"><label for="enlace">o enlace (p. ej. https://fahu.usach.cl/investigacion/)</label><input id="enlace" type="url" value="' + esc(r.enlace) + '"></div>' +
    '<div class="pie">' + (r.id ? '<button class="btn peligro" type="button" id="borrar">Eliminar</button>' : "") + '<button class="btn sec" type="button" id="cancelar">Cancelar</button><button class="btn" type="submit" id="guardar">Guardar</button></div></form>');
  m.querySelector("#cancelar").onclick = cerrarModal;
  m.querySelector("#fRef").onsubmit = async e => {
    e.preventDefault();
    const g = m.querySelector("#guardar"); g.disabled = true;
    try {
      const v = id => m.querySelector("#" + id).value.trim() || null;
      const fila = { tipo: v("tipo"), orden: Number(v("orden")) || 0, titulo: v("titulo"), descripcion: v("descripcion"), enlace: v("enlace") };
      if (fila.enlace && !urlSegura(fila.enlace)) throw new Error("El enlace debe empezar con https://");
      const f = m.querySelector("#archivo").files[0];
      if (f) {
        if (f.type !== "application/pdf") throw new Error("El archivo debe ser PDF.");
        const ruta = rutaArchivo("referencias", f.name);
        const up = await sb.storage.from(cfg.BUCKET).upload(ruta, f, { contentType: "application/pdf", upsert: false });
        if (up.error) throw up.error;
        fila.pdf = sb.storage.from(cfg.BUCKET).getPublicUrl(ruta).data.publicUrl;
      }
      if (!fila.pdf && !r.pdf && !fila.enlace) throw new Error("Carga un PDF o indica un enlace.");
      const q = r.id ? await sb.from("gi_referencias").update(fila).eq("id", r.id) : await sb.from("gi_referencias").insert(fila);
      if (q.error) throw q.error;
      if (f && r.pdf) { const vieja = rutaDesdeUrl(r.pdf); if (vieja) await sb.storage.from(cfg.BUCKET).remove([vieja]); }
      await anotar(sb, "GI: ", r.id ? "Referencia editada" : "Referencia agregada", fila.titulo);
      cerrarModal(); avisar("Guardado."); await recargar();
    } catch (err) { avisar(traducir(err.message), "err"); g.disabled = false; }
  };
  const b = m.querySelector("#borrar");
  if (b) b.onclick = async () => {
    if (!confirm("¿Eliminar «" + r.titulo + "»?")) return;
    const q = await sb.from("gi_referencias").delete().eq("id", r.id);
    if (q.error) { avisar(traducir(q.error.message), "err"); return; }
    const ruta = rutaDesdeUrl(r.pdf); if (ruta) await sb.storage.from(cfg.BUCKET).remove([ruta]);
    await anotar(sb, "GI: ", "Referencia eliminada", r.titulo);
    cerrarModal(); avisar("Eliminado."); await recargar();
  };
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-nueva],[data-editar],[data-docs],[data-editar-doc],[data-nueva-ref],[data-editar-ref],[data-ver]");
  if (!t) return;
  if (t.dataset.ver) return verArchivo(t.dataset.ver, t.dataset.titulo);
  if (!puede() && !t.dataset.docs) return;
  if ("nueva" in t.dataset) return formInstancia();
  if (t.dataset.editar) return formInstancia(st.inst.find(x => x.id === Number(t.dataset.editar)));
  if (t.dataset.docs) return verDocumentos(Number(t.dataset.docs));
  if (t.dataset.editarDoc) return formDocumento(st.docs.find(x => x.id === Number(t.dataset.editarDoc)));
  if ("nuevaRef" in t.dataset) return formRef();
  if (t.dataset.editarRef) return formRef(st.refs.find(x => x.id === Number(t.dataset.editarRef)));
});

async function recargar() {
  try { await cargar(); pintar(); } catch (e) { avisar("No se pudo actualizar: " + traducir(e.message), "err"); }
}

async function iniciar() {
  try {
    if (!sb) {
      ({ sb, cfg } = await conectar(new URL("./data/supabase/config.js?v=20261104", location.href).href));
      sb.auth.onAuthStateChange(ev => { if (ev === "PASSWORD_RECOVERY") pantallaNuevaClave(); });
    }
    if (/type=recovery/.test(location.hash)) return;
    const acc = await nivelEn(sb, PLATAFORMA);
    if (!acc.sesion) return pantallaLogin();
    cabecera(acc.sesion);
    if (!acc.perfil) return pantallaLogin({ texto: "Esta cuenta no pertenece al equipo del portal. Las cuentas se crean por invitación.", tipo: "av" });
    if (!acc.perfil.activo) return pantallaLogin({ texto: "Tu cuenta está suspendida. Escribe a viceinvestigacionfahu@usach.cl." });
    if (acc.nivel === "ninguno") {
      app.innerHTML = '<div class="login"><div class="caja"><h1 style="font-size:22px">Sin acceso a esta plataforma</h1><p>Tu cuenta no tiene asignado un nivel en «Grupos y Programas Centro». Pide a una persona con administración que lo asigne en la matriz «Acceso por plataforma» de cualquier panel.</p></div></div>';
      return;
    }
    st.nivel = acc.nivel; st.perfil = acc.perfil;
    await cargar(); pintar();
  } catch (e) {
    app.innerHTML = '<div class="aviso err">No se pudo abrir el panel: ' + esc(traducir(e.message)) + "</div>";
  }
}
iniciar();
</script>
