<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grupos y Programas Centro de Investigación · FAHU USACH</title>
<meta name="description" content="Catálogo público de los grupos y programas centro de investigación de la Facultad de Humanidades USACH: objetivos, integrantes y resoluciones.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&amp;family=Spectral:ital,wght@0,400;0,600;1,400&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../comun/vip.css?v=20261106">
<style>
  :root{--acento:#7A4FA3;--acento-f:#F1EAF7}
  .filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0 18px}
  .filtros input{max-width:340px}
  .filtros select{width:auto;min-width:170px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1.5px solid var(--borde2);background:#fff;border-radius:20px;padding:6px 13px;font:600 12px Archivo,sans-serif;color:var(--tinta2);cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--acento);border-color:var(--acento);color:#fff}
  .resumen{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0 6px}
  .resumen .caja{padding:14px 18px}
  .cifra{font:600 26px 'IBM Plex Mono',monospace;color:var(--acento);line-height:1.1}
  .tarjetas{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .tar{display:flex;flex-direction:column;gap:10px;background:#fff;border:1px solid var(--borde);border-top:4px solid var(--acento);border-radius:14px;padding:18px 20px;text-decoration:none;color:inherit;transition:transform .15s ease-out,box-shadow .15s ease-out}
  .tar.grupo{border-top-color:var(--teal2)}
  .tar:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(58,68,80,.10);color:inherit}
  .tar .sig{font:800 26px/1 Archivo,sans-serif;color:var(--acento);letter-spacing:.01em}
  .tar.grupo .sig{color:var(--teal)}
  .tar .nom{font:700 15px/1.3 Archivo,sans-serif;color:var(--tinta)}
  .tar .meta{font:400 12.5px/1.5 Archivo,sans-serif;color:var(--apagado)}
  .tar .pie{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;font:600 12px Archivo,sans-serif;color:var(--acento)}
  /* Ficha */
  .migas{font:600 12.5px Archivo,sans-serif;margin-bottom:14px}
  .ficha-cab{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start;margin-bottom:22px}
  .ficha-cab .sig{font:800 clamp(34px,5vw,48px)/1 Archivo,sans-serif;color:var(--acento)}
  .ficha-cab.grupo .sig{color:var(--teal)}
  .ficha{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px;align-items:start}
  .ficha section{margin:0 0 22px}
  .ficha h2{font-size:15px;letter-spacing:.02em;margin-bottom:10px}
  .ficha p,.ficha li{color:var(--tinta2);font-size:15px}
  .ficha ul{padding-left:20px;margin:6px 0}
  .dato{font:400 13px/1.5 Archivo,sans-serif;margin-bottom:10px}
  .dato b{display:block;font:600 11px Archivo,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--apagado)}
  .rol{font:700 11px Archivo,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--apagado);margin:14px 0 4px}
  .persona{font:400 13.5px/1.45 Archivo,sans-serif;padding:5px 0;border-top:1px dashed var(--borde)}
  .persona small{display:block;color:var(--apagado);font-size:12px}
  .linea-t{position:relative;padding-left:20px}
  .linea-t::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--borde)}
  .hito{position:relative;padding:0 0 14px}
  .hito::before{content:"";position:absolute;left:-19px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--acento);border:2px solid #fff;box-shadow:0 0 0 1px var(--borde)}
  .hito .cab{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:600 12px 'IBM Plex Mono',monospace;color:var(--tinta2)}
  .hito .tit{font:600 14px/1.4 Archivo,sans-serif;color:var(--tinta);margin:3px 0 2px}
  .hito .num{font:400 12px Archivo,sans-serif;color:var(--apagado)}
  .hito .acc{margin-top:6px}
  .refs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .ref{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid var(--borde);border-radius:10px;padding:12px 16px}
  .marco{margin-top:40px}
  @media screen and (max-width:900px){ .ficha{grid-template-columns:1fr} }
  @media screen and (max-width:760px){
    .resumen{grid-template-columns:1fr}
    .refs{grid-template-columns:1fr}
    .filtros input,.filtros select{max-width:none;width:100%}
    .ref{flex-direction:column;align-items:flex-start}
    .ficha-cab{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="barra">
  <a class="volver" href="/"><span aria-hidden="true">←</span>Gestión de Información VIP</a>
  <span class="miga">/ Grupos y Programas Centro de Investigación</span>
</div>
<header class="cabeza">
  <div>
    <a href="/" title="Ir al portal Gestión de Información VIP" style="display:inline-block;line-height:0"><img src="assets/logo-fahu.png" alt="Facultad de Humanidades · Universidad de Santiago de Chile"></a>
    <span class="titulo">Grupos y Programas Centro de Investigación</span>
    <span class="sub">Vicedecanato de Investigación y Postgrado · FAHU USACH</span>
  </div>
  <div class="acciones"><a class="btn nar" href="admin.html">Panel de actualización</a></div>
</header>

<main id="app"><p class="nota">Cargando…</p></main>

<script type="module">
import { conectar, conReintento, esc, urlSegura, fechaLarga, hoyISO, normalizar, verArchivo, traducir } from "../comun/vip.js?v=20261106";

const TIPO_DOC = { creacion: "Creación", modificacion: "Modificación", nombramiento: "Designación de dirección", normativa_interna: "Normativa interna", integrantes: "Integrantes", otro: "Otro" };
const TIPO_REF = { reglamento: "Normativa", modelo: "Modelo de resolución", otro: "Documento de referencia" };
const est = { inst: [], docs: [], ints: [], refs: [], tipo: "", q: "", unidad: "", error: "" };
const app = document.getElementById("app");
let sb;

const clave = i => i.sigla || String(i.id);
const plural = (n, uno, varios) => n + " " + (n === 1 ? uno : varios);
const anio = f => String(f || "").slice(0, 4);
const esDireccion = r => /^(director|directora|coordinador|coordinadora)/i.test(r || "");
function direccionDe(id) {
  const ds = est.ints.filter(p => p.instancia === id && p.oficial && esDireccion(p.rol)).sort((a, b) => String(b.desde || "").localeCompare(String(a.desde || "")));
  return ds[0] || null;
}

/* ---------- Catálogo ---------- */
function vistaCatalogo() {
  const q = normalizar(est.q);
  const lista = est.inst.filter(i =>
    (!est.tipo || i.tipo === est.tipo) && (!est.unidad || i.unidad === est.unidad) &&
    (!q || normalizar([i.nombre, i.sigla, i.unidad, i.lineas, i.objetivo_general, (direccionDe(i.id) || {}).nombre].join(" ")).includes(q)));
  const unidades = [...new Set(est.inst.map(x => x.unidad).filter(Boolean))].sort((a, b) => a.localeCompare(b, "es"));
  app.innerHTML =
    '<div class="kicker">Catálogo público</div><h1>Grupos y Programas Centro de Investigación</h1>' +
    '<p class="lead">Instancias asociativas de investigación de la Facultad de Humanidades. Los <b>programas centro</b> se proyectan como centros de investigación; los <b>grupos</b> son instancias asociativas orientadas a promover actividades de investigación conjuntas. Cada ficha reúne sus objetivos, integrantes y resoluciones.</p>' +
    '<div class="resumen"><div class="caja"><div class="cifra">' + est.inst.filter(i => i.tipo === "programa_centro").length + '</div><div class="nota">Programas centro</div></div>' +
    '<div class="caja"><div class="cifra">' + est.inst.filter(i => i.tipo === "grupo").length + '</div><div class="nota">Grupos de investigación</div></div>' +
    '<div class="caja"><div class="cifra">' + est.docs.length + '</div><div class="nota">Resoluciones publicadas</div></div></div>' +
    '<div class="filtros" role="search"><label class="sr" for="q">Buscar</label><input id="q" type="search" value="' + esc(est.q) + '" placeholder="Buscar por nombre, sigla, línea o dirección…">' +
    '<div class="chips" role="group" aria-label="Tipo">' + [["", "Todos"], ["programa_centro", "Programas centro"], ["grupo", "Grupos"]].map(([v, r]) => '<button class="chip" data-tipo="' + v + '" aria-pressed="' + (est.tipo === v) + '">' + r + "</button>").join("") + "</div>" +
    (unidades.length > 1 ? '<label class="sr" for="unidad">Unidad</label><select id="unidad"><option value="">Todas las unidades</option>' + unidades.map(u => "<option" + (u === est.unidad ? " selected" : "") + ">" + esc(u) + "</option>").join("") + "</select>" : "") + "</div>" +
    (est.error ? '<div class="aviso err">' + esc(est.error) + "</div>" : "") +
    (!est.inst.length ? '<div class="vacio">Aún no hay instancias publicadas.</div>'
      : !lista.length ? '<div class="vacio">Ninguna instancia coincide con la búsqueda.</div>'
      : '<div class="tarjetas">' + lista.map(tarjeta).join("") + "</div>") +
    marcoNormativo();
  const q2 = document.getElementById("q");
  q2.oninput = e => { est.q = e.target.value; const pos = e.target.selectionStart; vistaCatalogo(); const n = document.getElementById("q"); n.focus(); n.setSelectionRange(pos, pos); };
  const u = document.getElementById("unidad"); if (u) u.onchange = e => { est.unidad = e.target.value; vistaCatalogo(); };
}

function tarjeta(i) {
  const d = direccionDe(i.id);
  return '<a class="tar' + (i.tipo === "grupo" ? " grupo" : "") + '" href="?i=' + encodeURIComponent(clave(i)) + '" data-ir="' + esc(clave(i)) + '">' +
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><span class="sig">' + esc(i.sigla || "") + "</span>" +
    (i.tipo === "programa_centro" ? '<span class="etq nar">Programa centro</span>' : '<span class="etq teal">Grupo</span>') + "</div>" +
    '<span class="nom">' + esc(i.nombre) + "</span>" +
    '<span class="meta">' + [d ? (d.rol + ": " + d.nombre) : "", i.unidad, i.fecha_creacion ? "Creado en " + anio(i.fecha_creacion) : ""].filter(Boolean).map(esc).join("<br>") + "</span>" +
    '<span class="pie"><span>' + plural(est.docs.filter(x => x.instancia === i.id).length, "resolución", "resoluciones") + " · " + plural(est.ints.filter(x => x.instancia === i.id).length, "integrante", "integrantes") + "</span><span>Ver ficha →</span></span></a>";
}

function marcoNormativo() {
  return '<section class="marco" aria-labelledby="t-ref"><div class="kicker">Para crear o actualizar una instancia</div><h2 id="t-ref">Marco normativo y modelos de resolución</h2>' +
    '<p class="lead">Normativa de la Facultad sobre grupos de investigación y programas centro, y modelos para redactar sus resoluciones.</p>' +
    (est.refs.length ? '<div class="refs">' + est.refs.map(r => {
      const pdf = urlSegura(r.pdf), enl = urlSegura(r.enlace);
      const acc = pdf ? '<button class="btn sec chico" data-ver="' + esc(pdf) + '" data-titulo="' + esc(r.titulo) + '">Ver</button>' : enl ? '<a class="btn sec chico" href="' + esc(enl) + '" target="_blank" rel="noopener">Abrir ↗</a>' : "";
      return '<div class="ref"><span><span class="etq ' + (r.tipo === "modelo" ? "nar" : "teal") + '">' + esc(TIPO_REF[r.tipo] || "") + '</span><br><b style="font:700 14px Archivo,sans-serif">' + esc(r.titulo) + "</b>" + (r.descripcion ? '<br><span class="nota">' + esc(r.descripcion) + "</span>" : "") + "</span>" + acc + "</div>";
    }).join("") + "</div>" : '<div class="vacio">La normativa y los modelos de resolución se publicarán aquí.</div>') +
    '<p class="nota" style="margin-top:12px">Las versiones oficiales también se publican en la <a href="https://fahu.usach.cl/investigacion/" target="_blank" rel="noopener">página de Investigación de la Facultad ↗</a>.</p></section>';
}

/* ---------- Ficha ---------- */
function vistaFicha(k) {
  const i = est.inst.find(x => clave(x).toLowerCase() === String(k).toLowerCase());
  if (!i) { app.innerHTML = '<div class="migas"><a href="./" data-ir="">← Todas las instancias</a></div><div class="vacio">No encontramos esa instancia. Puede que aún no esté publicada.</div>'; return; }
  document.title = (i.sigla ? i.sigla + " · " : "") + i.nombre + " · FAHU USACH";
  const hoy = hoyISO();
  const ps = est.ints.filter(p => p.instancia === i.id);
  const dir = direccionDe(i.id);
  const vigentes = ps.filter(p => p.oficial && p !== dir && !esDireccion(p.rol) && (!p.hasta || p.hasta >= hoy));
  const grupos = [
    ["Investigadores e investigadoras", p => /^investigador(a)?$/i.test(p.rol) || /asociad/i.test(p.rol)],
    ["Colaboradores y colaboradoras", p => /colaborador/i.test(p.rol)],
    ["Integrantes fundadores", p => /fundador/i.test(p.rol)],
    ["Integrantes", () => true]
  ];
  const usados = new Set();
  const bloques = grupos.map(([t, f]) => {
    const l = vigentes.filter(p => !usados.has(p.id) && f(p)).sort((a, b) => (a.orden - b.orden) || a.nombre.localeCompare(b.nombre, "es"));
    l.forEach(p => usados.add(p.id));
    return l.length ? '<div class="rol">' + t + "</div>" + l.map(persona).join("") : "";
  }).join("");
  const declarados = ps.filter(p => !p.oficial).sort((a, b) => a.nombre.localeCompare(b.nombre, "es"));
  const docs = est.docs.filter(d => d.instancia === i.id).sort((a, b) => String(a.fecha || "").localeCompare(String(b.fecha || "")));
  const sitio = urlSegura(i.sitio);
  app.innerHTML =
    '<div class="migas"><a href="./" data-ir="">← Todas las instancias</a></div>' +
    '<div class="ficha-cab' + (i.tipo === "grupo" ? " grupo" : "") + '"><div>' +
      '<div class="kicker">' + (i.tipo === "programa_centro" ? "Programa centro" : "Grupo de investigación") + " · Facultad de Humanidades</div>" +
      (i.sigla ? '<div class="sig">' + esc(i.sigla) + "</div>" : "") + '<h1 style="margin-top:6px">' + esc(i.nombre) + "</h1></div>" +
      (sitio ? '<a class="btn sec" href="' + esc(sitio) + '" target="_blank" rel="noopener">Sitio web ↗</a>' : "") + "</div>" +
    '<div class="ficha"><div>' +
      (i.descripcion ? '<section><h2>Presentación</h2><p>' + esc(i.descripcion) + "</p></section>" : "") +
      (i.objetivo_general || (i.objetivos_especificos || []).length ? '<section><h2>Objetivos</h2>' + (i.objetivo_general ? "<p><b>General.</b> " + esc(i.objetivo_general) + "</p>" : "") +
        ((i.objetivos_especificos || []).length ? "<p><b>Específicos.</b></p><ul>" + i.objetivos_especificos.map(o => "<li>" + esc(o) + "</li>").join("") + "</ul>" : "") + "</section>" : "") +
      (i.lineas ? '<section><h2>Líneas de investigación</h2><ul>' + i.lineas.split(/;\s*/).filter(Boolean).map(l => "<li>" + esc(l) + "</li>").join("") + "</ul></section>" : "") +
      ((i.actividades || []).length ? '<section><h2>Actividades destacadas</h2><ul>' + i.actividades.map(a => "<li>" + esc(a) + "</li>").join("") + "</ul></section>" : "") +
      '<section><h2>Resoluciones</h2>' + (docs.length ? '<div class="linea-t">' + docs.map(hito).join("") + "</div>" : '<p class="nota">Sin resoluciones publicadas.</p>') + "</section>" +
    '</div><aside><div class="caja">' +
      (dir ? '<div class="dato"><b>' + esc(dir.rol) + "</b>" + esc(dir.nombre) + "</div>" : "") +
      (i.unidad ? '<div class="dato"><b>Unidad</b>' + esc(i.unidad) + "</div>" : "") +
      (i.fecha_creacion ? '<div class="dato"><b>Creación</b>' + esc(fechaLarga(i.fecha_creacion)) + "</div>" : "") +
      (i.contacto ? '<div class="dato"><b>Contacto</b>' + esc(i.contacto) + "</div>" : "") +
      '<h2 style="margin-top:16px">Integrantes</h2>' + (bloques || '<p class="nota">Sin integrantes registrados por resolución.</p>') +
      (declarados.length ? '<div class="rol">Declarados por la instancia</div><p class="nota" style="margin:0 0 4px">Informados por la propia instancia; aún sin resolución.</p>' + declarados.map(persona).join("") : "") +
    "</div></aside></div>";
  window.scrollTo(0, 0);
}

function persona(p) {
  return '<div class="persona">' + esc(p.nombre) + (p.rol && !/^integrante$/i.test(p.rol) ? " <small>" + esc(p.rol) + (p.linea ? " · " + esc(p.linea) : "") + "</small>" : p.linea ? "<small>" + esc(p.linea) + "</small>" : "") + "</div>";
}

function hito(d) {
  const tit = d.titulo || TIPO_DOC[d.tipo] || "Resolución";
  const url = urlSegura(d.pdf), enl = urlSegura(d.enlace);
  return '<div class="hito"><div class="cab"><span>' + esc(d.fecha ? fechaLarga(d.fecha) : "Sin fecha") + '</span><span class="etq gris">' + esc(TIPO_DOC[d.tipo] || d.tipo) + "</span>" + (d.vigente ? "" : '<span class="etq gris">Anterior</span>') + "</div>" +
    '<div class="tit">' + esc(tit) + "</div>" +
    '<div class="num">' + esc([d.tipo_acto, d.numero ? "N° " + d.numero : ""].filter(Boolean).join(" ")) + "</div>" +
    (url ? '<div class="acc"><button class="btn sec chico" data-ver="' + esc(url) + '" data-titulo="' + esc(tit) + '">Ver resolución</button></div>'
      : enl ? '<div class="acc"><a class="btn sec chico" href="' + esc(enl) + '" target="_blank" rel="noopener">Abrir ↗</a></div>' : "") + "</div>";
}

/* ---------- Navegación ---------- */
function pintar() {
  const k = new URLSearchParams(location.search).get("i");
  if (new URLSearchParams(location.search).get("previa") && !document.getElementById("avisoPrevia")) {
    const a = document.createElement("div"); a.id = "avisoPrevia"; a.className = "aviso av"; a.style.cssText = "margin:0;border-radius:0;text-align:center";
    a.textContent = "Vista previa del equipo: se muestran también las instancias no publicadas.";
    document.body.insertBefore(a, document.body.firstChild);
  }
  if (k) vistaFicha(k); else { document.title = "Grupos y Programas Centro de Investigación · FAHU USACH"; vistaCatalogo(); }
}
document.addEventListener("click", e => {
  const ir = e.target.closest("[data-ir]");
  if (ir && !e.metaKey && !e.ctrlKey && !e.shiftKey) {
    e.preventDefault();
    const previa = new URLSearchParams(location.search).get("previa") ? "previa=1" : "";
    history.pushState(null, "", ir.dataset.ir ? "?i=" + encodeURIComponent(ir.dataset.ir) + (previa ? "&" + previa : "") : location.pathname + (previa ? "?" + previa : ""));
    pintar(); return;
  }
  const ver = e.target.closest("[data-ver]");
  if (ver) { verArchivo(ver.dataset.ver, ver.dataset.titulo); return; }
  const chip = e.target.closest("[data-tipo]");
  if (chip) { est.tipo = chip.dataset.tipo; vistaCatalogo(); }
});
window.addEventListener("popstate", pintar);

async function cargar() {
  try {
    // Público: sin sesión. Vista previa (?previa=1): con la sesión del panel, para ver borradores.
    const previa = !!new URLSearchParams(location.search).get("previa");
    if (!sb) sb = (await conectar(new URL("./data/supabase/config.js?v=20261104", location.href).href, { anonimo: !previa })).sb;
    const [i, d, p, r] = await conReintento(() => Promise.all([
      // ?previa=1: el equipo con acceso a «grupos» ve también los borradores (la base solo los entrega a esas cuentas)
      (new URLSearchParams(location.search).get("previa") ? sb.from("gi_instancias").select("*") : sb.from("gi_instancias").select("*").eq("publicado", true)).order("nombre"),
      sb.from("gi_documentos").select("*"),
      sb.from("gi_integrantes").select("*"),
      sb.from("gi_referencias").select("*").order("orden").order("titulo")
    ]));
    const err = i.error || d.error || p.error || r.error;
    if (err) throw err;
    const ids = new Set(i.data.map(x => x.id));
    est.inst = i.data; est.docs = d.data.filter(x => ids.has(x.instancia)); est.ints = p.data.filter(x => ids.has(x.instancia)); est.refs = r.data; est.error = "";
  } catch (e) { est.error = "No se pudo cargar el catálogo: " + traducir(e.message); }
  pintar();
}
cargar();
</script>
</body>
</html>
