<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Spectral:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--tinta:#3A4450;--tinta2:#5A6470;--apagado:#8A8272;--deshab:#A8A192;--borde:#E8E4DA;--campo:#E0DCD0;--fila:#F0EDE4;
    --fondo:#F1EFE8;--fcampo:#FAF9F5;--teal:#007E80;--teal2:#00A0A0;--naranja:#EF7A00;--verde:#2F6B4F;--rojo:#8A3D2E}
  *{box-sizing:border-box}
  body{margin:0;background:var(--fondo);color:var(--tinta);font-family:Spectral,Georgia,serif}
  a{color:var(--teal)} a:hover{color:var(--naranja)}
  button{font:600 12px Archivo,sans-serif;cursor:pointer;border-radius:8px;padding:9px 13px;border:1.5px solid var(--campo);background:#fff;color:var(--teal)}
  button:hover{border-color:var(--teal2);background:var(--fcampo)}
  button.prim{background:var(--teal);border-color:var(--teal);color:#fff} button.prim:hover{background:var(--naranja);border-color:var(--naranja)}
  button.ambar{background:#FCEBD9;border-color:#F5D3B0;color:#8A5A00}
  button:disabled{opacity:.5;cursor:default}
  input,select,textarea{font:400 13px Archivo,sans-serif;padding:10px 12px;border:1.5px solid var(--campo);border-radius:9px;background:var(--fcampo);color:var(--tinta);width:100%}
  textarea{font:400 14px/1.6 Spectral,serif;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal2)}
  button:focus-visible,a:focus-visible{outline:2px solid var(--teal2);outline-offset:2px}
  .mono{font-family:'IBM Plex Mono',monospace}
  header{background:var(--tinta);padding:14px clamp(16px,5vw,60px);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
  header img{height:48px;filter:brightness(0) invert(1)}
  .htit{font:800 15px Archivo,sans-serif;color:#fff} .hsub{font:400 11.5px Archivo,sans-serif;color:rgba(255,255,255,.65)}
  .sesion{font:600 11px Archivo,sans-serif;color:rgba(255,255,255,.75)}
  nav{background:#fff;border-bottom:1px solid var(--borde);padding:0 clamp(16px,5vw,60px);display:flex;gap:4px;overflow-x:auto}
  nav button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;color:var(--apagado);font:600 13px Archivo,sans-serif;padding:14px 16px}
  nav button.act{border-bottom-color:var(--teal);color:var(--tinta)}
  main{max-width:1200px;margin:0 auto;padding:26px clamp(16px,5vw,60px) 70px}
  h2{font:800 19px Archivo,sans-serif;margin:0} h3{font:800 15px Archivo,sans-serif;margin:0 0 12px}
  .tarjeta{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:20px}
  .et{font:700 9.5px Archivo,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--apagado);margin:0 0 6px;display:block}
  .kicker{font:600 11px Archivo,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--naranja)}
  .resumen{font:400 13.5px/1.6 Spectral,serif;color:var(--tinta2)}
  .tag{display:inline-block;font:600 9.5px Archivo,sans-serif;letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:3px 7px}
  .t-adm{color:#5A6470;background:#EFECE4} .t-tra{color:#007E80;background:#E4F2F2} .t-vb{color:#8A5A00;background:#FCEBD9}
  .t-ok{color:#2F6B4F;background:#E7F3EB} .t-no{color:#8A3D2E;background:#F9EDE9}
  .tabla{background:#fff;border:1px solid var(--borde);border-radius:14px;overflow:hidden}
  .fila{display:grid;grid-template-columns:76px 1.3fr 1.1fr 170px 140px 96px 52px;gap:10px;padding:13px 20px;border-bottom:1px solid var(--fila);align-items:center;cursor:pointer}
  .fila:hover{background:var(--fcampo)} .fila.enc{cursor:default;background:var(--fcampo);font:600 10.5px Archivo,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--apagado)}
  .fila.enc .ord{cursor:pointer;user-select:none;border-radius:5px;padding:2px 4px;margin:-2px -4px} .fila.enc .ord:hover,.fila.enc .ord:focus-visible{color:var(--tinta);background:#fff;outline:none}
  .fila.enc .ord.act{color:var(--tinta)} .fila.enc .flecha{font-size:8px;margin-left:4px;vertical-align:1px}
  .nom{font:700 13.5px Archivo,sans-serif} .sub{font:400 12px Archivo,sans-serif;color:var(--apagado);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .filtros{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin:16px 0}
  .grid2{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:26px;align-items:start}
  .pila>*+*{margin-top:16px}
  .lado{position:sticky;top:16px}
  .dl{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .bit{border-left:2px solid var(--fila);margin-left:5px;padding-left:16px}
  .bit .it{position:relative;padding-bottom:14px} .bit .it::before{content:'';position:absolute;left:-22px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--c,#C9C2B0)}
  .bit .meta{font:400 11px 'IBM Plex Mono',monospace;color:var(--apagado)} .bit .tx{font:400 13.5px/1.55 Spectral,serif;white-space:pre-line}
  .chip{display:inline-block;margin-top:4px;font:600 11px Archivo,sans-serif;color:var(--teal);background:#E4F2F2;border-radius:6px;padding:3px 8px}
  .aviso{font:600 12px Archivo,sans-serif;border-radius:10px;padding:10px 12px}
  .a-amb{background:#FBEEDD;color:#94571B} .a-rojo{background:#F9EBE8;color:#B0483A} .a-teal{background:#E4F2F2;color:#1F5C5E}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .kpi{background:#fff;border:1px solid var(--borde);border-top:4px solid var(--c);border-radius:14px;padding:18px}
  .kpi b{display:block;font:600 34px/1 'IBM Plex Mono',monospace} .kpi span{font:600 11px Archivo,sans-serif;text-transform:uppercase;color:var(--apagado)}
  .barra{height:5px;background:var(--fila);border-radius:3px;margin:4px 0 10px} .barra i{display:block;height:5px;background:var(--teal2);border-radius:3px}
  #fondo{position:fixed;inset:0;background:rgba(58,68,80,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:10}
  #dlg{background:#fff;border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.3);padding:24px 26px 22px;max-width:680px;width:100%}
  #toast{position:fixed;right:20px;bottom:20px;background:var(--tinta);color:#fff;font:600 12.5px Archivo,sans-serif;border-radius:10px;padding:11px 16px;box-shadow:0 12px 32px rgba(58,68,80,.25);display:none;max-width:420px;z-index:20}
  #toast.err{background:#8A3D2E}
  #visor{position:fixed;inset:0;background:rgba(36,42,50,.72);display:none;flex-direction:column;align-items:center;padding:20px 16px;z-index:15}
  #visor.abierto{display:flex}
  #visor .vmarco{background:#fff;border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.35);width:100%;max-width:1040px;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  #visor .vcab{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--fila)}
  #visor .vcab b{flex:1;min-width:0;font:700 14px Archivo,sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #v_cuerpo{flex:1;overflow:auto;background:#E9E6DE;padding:16px;text-align:center}
  #v_cuerpo canvas,#v_cuerpo img{display:block;margin:0 auto 14px;max-width:100%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15)}
  #v_cuerpo pre{text-align:left;white-space:pre-wrap;background:#fff;padding:20px;border-radius:8px;font:400 13px/1.5 'IBM Plex Mono',monospace;margin:0 auto;max-width:900px}
  .cargando{font:400 14px Spectral,serif;color:var(--apagado);padding:40px 0;text-align:center}
  .lista-item{padding:13px 18px;border-left:3px solid transparent;border-bottom:1px solid var(--fila);cursor:pointer}
  .lista-item.sel{border-left-color:var(--teal);background:var(--fcampo)}
  .pan-f{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}
  .chipf{border:1px solid var(--borde);background:#fff;border-radius:999px;padding:6px 12px;font:600 12px Archivo,sans-serif;color:var(--tinta)}
  .chipf.act{background:var(--tinta);color:#fff;border-color:var(--tinta)}
  .chipf span{font-family:'IBM Plex Mono',monospace;font-weight:600;opacity:.7;margin-left:4px}
  .prow{display:grid;grid-template-columns:1.25fr 1fr 1.7fr 1fr;gap:14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--fila);cursor:pointer}
  .prow:hover,.prow:focus-visible{background:var(--fcampo)}
  .prow .sub{white-space:normal}
  .track{display:flex;align-items:center;margin-bottom:5px}
  .track i{width:10px;height:10px;border-radius:50%;flex-shrink:0;border:2px solid #D8D3C5;background:#fff;box-sizing:border-box}
  .track i.h{background:var(--teal2);border-color:var(--teal2)}
  .track i.a{background:var(--naranja);border-color:var(--naranja);width:14px;height:14px}
  .track i.n{background:#8A3D2E;border-color:#8A3D2E;width:14px;height:14px}
  .track b{flex:1;height:2px;background:#E0DCD0;min-width:4px} .track b.h{background:var(--teal2)}
  @media(max-width:760px){.prow{grid-template-columns:1fr;gap:6px}}
  .vars code{font:400 11px 'IBM Plex Mono',monospace;background:#EFECE4;border-radius:4px;padding:2px 5px;margin:2px;display:inline-block}
  .acciones{display:flex;gap:8px;flex-wrap:wrap}
  label.chk{display:flex;gap:8px;align-items:center;font:400 13px Archivo,sans-serif;margin:4px 0} label.chk input{width:auto}
  .sesion-box{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header button.salir{background:transparent;border-color:rgba(255,255,255,.35);color:#fff;padding:7px 12px}
  header button.salir:hover{background:rgba(255,255,255,.12);border-color:#fff}
  .ingreso{max-width:460px;margin:clamp(24px,8vh,80px) auto;background:#fff;border:1px solid var(--borde);border-radius:16px;padding:32px 30px 26px}
  .ingreso h2{font:800 22px Archivo,sans-serif;margin:8px 0 6px}
  .ingreso .cuenta{display:flex;align-items:center;gap:12px;background:var(--fcampo);border:1px solid var(--borde);border-radius:12px;padding:12px 14px;margin:18px 0 16px}
  .ingreso .avatar{width:38px;height:38px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font:800 15px Archivo,sans-serif;flex:none}
  .ingreso .btn-g{display:block;width:100%;text-align:center;font:600 13px Archivo,sans-serif;padding:12px;border-radius:9px;text-decoration:none}
  .ingreso .btn-g.prim{background:var(--teal);color:#fff;border:1.5px solid var(--teal)} .ingreso .btn-g.prim:hover{background:var(--naranja);border-color:var(--naranja);color:#fff}
  .ingreso .btn-g.sec{border:1.5px solid var(--campo);color:var(--teal);margin-top:10px} .ingreso .btn-g.sec:hover{border-color:var(--teal2);background:var(--fcampo)}
  .ingreso .nota{font:400 12px/1.5 Archivo,sans-serif;color:var(--apagado);margin-top:18px;border-top:1px solid var(--fila);padding-top:14px}
  @media (max-width:760px){
    .grid2,.filtros,.kpis,.dl{grid-template-columns:minmax(0,1fr)}
    .fila{grid-template-columns:70px 1fr;}
    .fila>:nth-child(n+3){display:none}
    .lado{position:static}
    button,select,input{min-height:44px}
  }
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:14px">
    <a href="https://vipfahu.netlify.app/" title="Ir al portal Gestión de Información VIP" aria-label="Ir al portal Gestión de Información VIP" target="_top" style="display:inline-block;line-height:0"><img src="https://vipfahu.netlify.app/assets/logo-fahu.png" alt="Facultad de Humanidades USACH"></a>
    <div><div class="htit">Concesiones Académicas de Excepción</div><div class="hsub">Panel de gestión · Vicedecanato de Investigación y Postgrado</div></div>
  </div>
  <div class="sesion-box"><div class="sesion" id="sesion"></div><button class="salir" id="salir" hidden>Cerrar sesión</button></div>
</header>
<nav id="nav"></nav>
<main id="app"><div class="cargando">Cargando…</div></main>
<div id="fondo"><div id="dlg" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>
<div id="visor" role="dialog" aria-modal="true" aria-labelledby="v_nombre"><div class="vmarco">
  <div class="vcab"><button id="v_volver" style="display:none">← Contenido del ZIP</button><b id="v_nombre"></b><button id="v_desc">Descargar</button><button id="v_cerrar" class="prim">Cerrar</button></div>
  <div id="v_cuerpo"></div>
</div></div>

<script>
const FOLIO_INICIAL = '<?= folioInicial ?>';
const URL_PANEL = '<?= url ?>';
// Google identifica a la persona (cuenta @usach.cl); la plataforma no maneja contraseñas.
const URL_OTRA_CUENTA = 'https://accounts.google.com/AccountChooser?continue=' + encodeURIComponent(URL_PANEL || '');
const URL_SALIR_GOOGLE = 'https://accounts.google.com/Logout';
const CLAVE_SESION = 'cae_sesion';
const sesionGuardada = () => { try { return sessionStorage.getItem(CLAVE_SESION) || ''; } catch (e) { return ''; } };
const guardarSesion = v => { try { v ? sessionStorage.setItem(CLAVE_SESION, v) : sessionStorage.removeItem(CLAVE_SESION); } catch (e) { /* sin almacenamiento: se pedirá ingresar en cada carga */ } };
const S = { ini: null, vista: 'bandeja', bandeja: [], filtro: { q: '', grupo: 'curso', programa: '', analista: '' }, orden: { campo: 'fecha_recepcion', dir: -1 }, exp: null, plantillas: [], plSel: '', plModo: 'editar', cuentas: null, config: null };

/* ── utilidades ── */
const h = s => String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);
function run(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  return new Promise((ok, mal) => google.script.run.withSuccessHandler(ok).withFailureHandler(mal)[fn].apply(null, args));
}
function toast(msg, err) {
  const t = $('toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.style.display = 'none'; }, err ? 7000 : 4200);
}
function fallo(e) { toast(String(e && e.message || e).replace(/^Error:\s*/, '').replace(/^(SIN_ACCESO|SIN_IDENTIDAD):\s*/, ''), true); }
const fecha = iso => { if (!iso) return '—'; const d = new Date(iso); return isNaN(d) ? String(iso) : ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2) + '.' + d.getFullYear(); };
const fechaHora = iso => { if (!iso) return 'sin fecha · migrado'; const d = new Date(iso); return isNaN(d) ? String(iso) : fecha(iso) + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); };
const dias = iso => iso ? Math.max(0, Math.round((Date.now() - new Date(iso)) / 864e5)) : '';
const etq = id => (S.ini.estados.find(e => e.id === id) || {}).etiqueta || id;
const cierre = id => ['resuelto', 'rechazada', 'no_procede', 'negado'].indexOf(id) >= 0;
function clase(id) {
  if (id === 'resuelto') return 't-ok';
  if (['rechazada', 'no_procede', 'negado'].indexOf(id) >= 0) return 't-no';
  if (id === 'vb') return 't-vb';
  if (id === 'rechazo_vb') return 't-no';
  if (id === 'recibida' || id === 'revision') return 't-adm';
  return 't-tra';
}
const tag = (id, grande) => '<span class="tag ' + clase(id) + '"' + (grande ? ' style="font-size:10.5px;border-radius:999px;padding:5px 10px"' : '') + '>' + h(etq(id)) + '</span>';
const nivel = n => ['sin_acceso', 'consulta', 'edicion', 'administracion'].indexOf(S.ini.usuario.nivel) >= ['sin_acceso', 'consulta', 'edicion', 'administracion'].indexOf(n);

/* ── arranque: página de ingreso y cierre de sesión ── */
run('api_inicio').then(r => {
  S.ini = r;
  if (r.acceso && sesionGuardada() === r.usuario.correo) return entrar();
  pantallaIngreso(r);
}).catch(fallo);

function pantallaIngreso(r) {
  $('nav').innerHTML = ''; $('sesion').textContent = ''; $('salir').hidden = true;
  const correo = r.acceso ? r.usuario.correo : (r.correo || '');
  const nombre = r.acceso ? (r.usuario.nombre || r.usuario.correo) : '';
  let cuerpo;
  if (r.acceso) {
    cuerpo = '<p class="resumen">Acceso exclusivo para el equipo del Vicedecanato de Investigación y Postgrado.</p>' +
      '<div class="cuenta"><div class="avatar">' + h(nombre.trim().charAt(0).toUpperCase()) + '</div><div style="min-width:0"><div class="nom">' + h(nombre) + '</div>' +
      '<div class="sub">' + h(correo) + ' · ' + h(r.usuario.rol || '') + ' · ' + h(({ consulta: 'Consulta', edicion: 'Edición', administracion: 'Administración' })[r.usuario.nivel] || '') + '</div></div></div>' +
      '<button class="prim btn-g" id="entrar" style="width:100%;padding:12px">Ingresar como ' + h(nombre) + '</button>' +
      '<a class="btn-g sec" href="' + h(URL_OTRA_CUENTA) + '" target="_top">Usar otra cuenta USACH</a>';
  } else if (r.motivo === 'sin_acceso') {
    cuerpo = '<p class="resumen">La cuenta con que está conectado no tiene acceso a la plataforma o está desactivada.</p>' +
      '<div class="cuenta"><div class="avatar" style="background:var(--deshab)">?</div><div style="min-width:0"><div class="nom">Sin acceso</div><div class="sub">' + h(correo) + '</div></div></div>' +
      '<a class="btn-g prim" href="' + h(URL_OTRA_CUENTA) + '" target="_top">Ingresar con otra cuenta USACH</a>' +
      '<p class="resumen" style="font-size:12.5px;margin-top:12px">Si necesita acceso, solicítelo al Vicedecanato.</p>';
  } else {
    cuerpo = '<p class="resumen">Google no entregó su correo. Ingrese con su cuenta <b>@usach.cl</b>.</p>' +
      '<a class="btn-g prim" href="' + h(URL_OTRA_CUENTA) + '" target="_top">Iniciar sesión con cuenta USACH</a>';
  }
  $('app').innerHTML = '<div class="ingreso"><div class="kicker">Panel de gestión</div><h2>Iniciar sesión</h2>' + cuerpo +
    '<div class="nota">El ingreso usa su cuenta institucional de Google; la plataforma no guarda contraseñas. Si tiene varias cuentas de Google abiertas y la página no carga, use una ventana de incógnito.</div></div>';
  if ($('entrar')) $('entrar').onclick = () => { guardarSesion(r.usuario.correo); entrar(); };
}

function entrar() {
  const r = S.ini;
  $('sesion').textContent = (r.usuario.nombre || r.usuario.correo) + ' · ' + ({ consulta: 'Consulta', edicion: 'Edición', administracion: 'Administración' })[r.usuario.nivel];
  $('salir').hidden = false;
  $('salir').onclick = dialogoSalir;
  // El Vicedecano/a parte con la planilla completa (todos los estados); «Pendiente V°B°» queda como filtro y en el resumen.
  if (r.usuario.rol === 'Vicedecano/a') S.filtro.grupo = 'todas';
  pintarNav();
  cargarBandeja().then(() => { if (/^\d{2}\/\d{4}$/.test(FOLIO_INICIAL)) abrir(FOLIO_INICIAL); });
}

function dialogoSalir() {
  $('dlg').innerHTML = '<div class="kicker" style="color:var(--apagado)">Cerrar sesión</div><h3 style="margin-top:6px">¿Cómo desea salir?</h3>' +
    '<button class="prim" id="salir-panel" style="width:100%;text-align:left;margin-bottom:8px">Salir del panel<br><span style="font-weight:400">Vuelve a la página de ingreso. Su cuenta de Google sigue abierta en este navegador.</span></button>' +
    '<a href="' + h(URL_SALIR_GOOGLE) + '" target="_top" id="salir-google" style="display:block;text-decoration:none;border:1.5px solid var(--campo);border-radius:8px;padding:9px 13px;font:600 12px Archivo,sans-serif;color:var(--rojo)">Cerrar sesión de Google en este equipo<br><span style="font-weight:400;color:var(--tinta2)">Recomendado en computadores compartidos. Cierra todas las cuentas de Google abiertas en este navegador (también Gmail y Drive).</span></a>' +
    '<div class="acciones" style="justify-content:flex-end;margin-top:14px"><button id="cancelar">Cancelar</button></div>';
  $('fondo').style.display = 'flex';
  $('cancelar').onclick = cerrarDlg;
  $('salir-panel').onclick = () => { guardarSesion(''); cerrarDlg(); S.vista = 'bandeja'; S.exp = null; pantallaIngreso(S.ini); };
  $('salir-google').onclick = () => guardarSesion('');
}

function pintarNav() {
  const tabs = [['bandeja', 'Bandeja'], ['panorama', 'Panorama'], ['indicadores', 'Indicadores'], ['plantillas', 'Plantillas de correo'], ['config', 'Configuración']];
  if (nivel('administracion')) tabs.push(['cuentas', 'Cuentas']);
  $('nav').innerHTML = tabs.map(t => '<button data-v="' + t[0] + '" class="' + (S.vista === t[0] || (S.vista === 'exp' && t[0] === 'bandeja') ? 'act' : '') + '">' + t[1] + '</button>').join('');
  $('nav').querySelectorAll('button').forEach(b => b.onclick = () => ir(b.dataset.v));
}
function ir(v) {
  S.vista = v; pintarNav();

/* ── Bandeja ── */
function cargarBandeja() {
  $('app').innerHTML = '<div class="cargando">Cargando solicitudes…</div>';
  return run('api_bandeja').then(l => { S.bandeja = l; pintarBandeja(); }).catch(fallo);
}
function filtrar() {
  const f = S.filtro, q = f.q.trim().toLowerCase();
  return S.bandeja.filter(s => {
    if (f.grupo === 'curso' && cierre(s.estado)) return false;
    if (f.grupo === 'vb' && s.estado !== 'vb') return false;
    if (f.grupo === 'cerradas' && !cierre(s.estado)) return false;
    if (f.grupo === 'revisar' && s.revisar !== 'SÍ') return false;
    if (f.programa && s.programa !== f.programa) return false;
    if (f.analista === '__sin' ? !!s.analista : (f.analista && s.analista !== f.analista)) return false;
    return !q || [s.folio, s.nombre, s.run, s.programa, s.tipo].join(' ').toLowerCase().indexOf(q) >= 0;
  }).sort(comparador());
}
/* Columnas por las que se ordena la Bandeja (clic en el encabezado; segundo clic invierte). */
const ORDENES = {
  folio: { titulo: 'Folio', clave: s => { const m = /^(\d+)\/(\d{4})$/.exec(s.folio || ''); return m ? Number(m[2]) * 1000 + Number(m[1]) : 0; } },
  nombre: { titulo: 'Solicitante', clave: s => String(s.nombre || '').toLowerCase() },
  programa: { titulo: 'Programa · tipo', clave: s => String(s.programa || '').toLowerCase() + '|' + String(s.tipo || '').toLowerCase() },
  estado: { titulo: 'Estado', clave: s => { const i = S.ini.estados.findIndex(e => e.id === s.estado); return i < 0 ? 999 : i; } },
  analista: { titulo: 'Analista', clave: s => String(s.analistaNombre || '').toLowerCase() || '~' },
  fecha_recepcion: { titulo: 'Recibida', clave: s => String(s.fecha_recepcion || '') },
  dias: { titulo: 'Días', clave: s => cierre(s.estado) ? -1 : dias(s.estado_desde) || 0 }
};
function comparador() {
  const o = ORDENES[S.orden.campo] || ORDENES.fecha_recepcion, dir = S.orden.dir || -1;
  return (a, b) => { const x = o.clave(a), y = o.clave(b); const c = typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y)); return (c || String(b.fecha_recepcion).localeCompare(String(a.fecha_recepcion))) * (c ? dir : 1); };
}
function ordenarPor(campo) {
  if (S.orden.campo === campo) S.orden.dir = -S.orden.dir;
  else S.orden = { campo: campo, dir: campo === 'fecha_recepcion' || campo === 'dias' || campo === 'folio' ? -1 : 1 };
  pintarFilas();
}
function pintarBandeja() {
  const l = S.bandeja, curso = l.filter(s => !cierre(s.estado)).length, vb = l.filter(s => s.estado === 'vb').length, rev = l.filter(s => s.revisar === 'SÍ').length;
  const progs = [...new Set(l.map(s => s.programa))].sort();
  const sel = (id, ops, val) => '<select id="' + id + '">' + ops.map(o => '<option value="' + h(o[0]) + '"' + (o[0] === val ? ' selected' : '') + '>' + h(o[1]) + '</option>').join('') + '</select>';
  $('app').innerHTML =
    '<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap"><div><h2>Bandeja de solicitudes <span class="mono" style="font-size:12px;color:var(--apagado)" id="cont"></span></h2>' +
    '<div class="resumen">' + curso + ' en curso · ' + vb + ' pendientes de V°B° · ' + (l.length - curso) + ' cerradas' + (rev ? ' · <b style="color:#94571B">' + rev + ' por revisar (migración)</b>' : '') + '</div></div></div>' +
    '<div class="tarjeta filtros" style="padding:14px 16px"><input id="fq" placeholder="Buscar por folio, nombre, RUN o tipo…" value="' + h(S.filtro.q) + '">' +
    sel('fg', [['todas', 'Todos los estados'], ['curso', 'En curso'], ['vb', 'Pendiente V°B°'], ['cerradas', 'Cerradas'], ['revisar', 'Por revisar']], S.filtro.grupo) +
    sel('fp', [['', 'Todos los programas']].concat(progs.map(p => [p, p])), S.filtro.programa) +
    sel('fa', [['', 'Todas las analistas'], ['__sin', 'Sin asignar']].concat(S.ini.analistas.map(a => [a.correo, a.nombre])), S.filtro.analista) + '</div>' +
    '<div class="tabla" id="tabla"></div>';
  $('fq').oninput = e => { S.filtro.q = e.target.value; pintarFilas(); };
  $('fg').onchange = e => { S.filtro.grupo = e.target.value; pintarFilas(); };
  $('fp').onchange = e => { S.filtro.programa = e.target.value; pintarFilas(); };
  $('fa').onchange = e => { S.filtro.analista = e.target.value; pintarFilas(); };
  pintarFilas();
}
function pintarFilas() {
  const l = filtrar();
  $('cont').textContent = l.length + ' de ' + S.bandeja.length;
  const enc = Object.keys(ORDENES).map(k => { const act = S.orden.campo === k; return '<div class="ord' + (act ? ' act' : '') + '" data-o="' + k + '" role="button" tabindex="0" title="Ordenar por ' + h(ORDENES[k].titulo) + '" aria-sort="' + (act ? (S.orden.dir > 0 ? 'ascending' : 'descending') : 'none') + '">' + h(ORDENES[k].titulo) + (act ? '<span class="flecha">' + (S.orden.dir > 0 ? '▲' : '▼') + '</span>' : '') + '</div>'; }).join('');
  $('tabla').innerHTML = '<div class="fila enc">' + enc + '</div>' +
    (l.length ? l.map(s => '<div class="fila" data-f="' + h(s.folio) + '" tabindex="0"><div class="mono" style="font-weight:600;font-size:12px">' + h(s.folio) + (s.revisar === 'SÍ' ? ' <span title="Revisar (migración)" style="color:#94571B">●</span>' : '') + '</div>' +
      '<div><div class="nom">' + h(s.nombre) + '</div><div class="sub mono">' + h(s.run) + '</div></div>' +
      '<div style="min-width:0"><div class="sub" style="color:var(--tinta);font-weight:600">' + h(s.programa) + '</div><div class="sub">' + h(s.tipo) + '</div></div>' +
      '<div>' + tag(s.estado) + '</div><div class="sub">' + h(s.analistaNombre || 'Sin asignar') + '</div>' +
      '<div class="mono" style="font-size:11.5px;color:var(--apagado)">' + fecha(s.fecha_recepcion) + '</div>' +
      '<div class="mono" style="font-weight:600;font-size:12px;color:' + (cierre(s.estado) ? 'var(--deshab)' : 'var(--naranja)') + '">' + (cierre(s.estado) ? '—' : dias(s.estado_desde)) + '</div></div>').join('')
      : '<div class="cargando">Sin solicitudes con estos filtros.</div>');
  $('tabla').querySelectorAll('.fila[data-f]').forEach(r => { r.onclick = () => abrir(r.dataset.f); r.onkeydown = e => { if (e.key === 'Enter') abrir(r.dataset.f); }; });
  $('tabla').querySelectorAll('[data-o]').forEach(c => { c.onclick = () => ordenarPor(c.dataset.o); c.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); ordenarPor(c.dataset.o); } }; });
}

/* ── Visor de archivos dentro del panel: PDF, imágenes, texto, Word (convertido a PDF en el servidor) y el contenido de
   un ZIP, documento por documento. El archivo se dibuja en el navegador; no pasa por servicios externos. ── */
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let pdfjsListo = null;
function cargarPdfjs() {
  // Se carga solo la primera vez que se abre un PDF. El «worker» se carga en la misma página: pdf.js lo usa sin crear
  // un Worker aparte (el marco de Apps Script puede impedirlo).
  const cargar = src => new Promise((ok, mal) => { const t = document.createElement('script'); t.src = src; t.onload = ok; t.onerror = () => mal(new Error('No se pudo cargar el visor de PDF. Use «Descargar».')); document.head.appendChild(t); });
  if (!pdfjsListo) pdfjsListo = cargar(PDFJS + 'pdf.min.js').then(() => cargar(PDFJS + 'pdf.worker.min.js')).then(() => {
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js';
    return window.pdfjsLib;
  }).catch(e => { pdfjsListo = null; throw e; });
  return pdfjsListo;
}
const bytesDe = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));
const V = { n: 0, zip: null };   // zip: { id, nombre, entradas } mientras se recorre un ZIP
function cerrarVisor() { V.n++; V.zip = null; $('visor').classList.remove('abierto'); $('v_cuerpo').innerHTML = ''; }
function visorCargando(titulo, texto) {
  $('v_nombre').textContent = titulo;
  $('v_cuerpo').innerHTML = '<div class="cargando">' + h(texto) + '</div>';
  $('v_desc').disabled = true;
  $('v_volver').style.display = V.zip ? '' : 'none';
  $('visor').classList.add('abierto');
}
function avisoVisor(msj) { $('v_cuerpo').innerHTML = '<div class="aviso a-amb" style="text-align:left;max-width:640px;margin:0 auto">' + h(msj) + '</div>'; }
/** Abre un archivo del expediente; «entrada» = índice de un documento dentro del ZIP «id». */
function ver(id, nombre, entrada) {
  const n = ++V.n, enZip = entrada !== undefined && entrada !== null;
  if (!enZip) V.zip = null;
  visorCargando(enZip ? V.zip.nombre + ' › ' + nombre : nombre || 'Archivo', /\.(docx?|odt|rtf)$/i.test(nombre || '') ? 'Convirtiendo a PDF…' : 'Cargando…');
  $('v_cerrar').focus();
  run('api_verArchivo', S.exp.folio, id, enZip ? entrada : null).then(async r => {
    if (n !== V.n) return;
    if (r.modo === 'enlace') { cerrarVisor(); window.open(r.url, '_blank'); toast('El archivo supera el máximo para verlo aquí: se abrió en Drive (acceso de lectura registrado en la bitácora)'); return; }
    if (r.modo === 'zip') return pintarZip(id, r);
    $('v_desc').disabled = false;
    $('v_desc').onclick = () => guardarArchivo(r);
    if (r.convertido) $('v_nombre').textContent += ' (vista en PDF)';
    await pintarDocumento(r, n);
  }).catch(e => { if (n === V.n) avisoVisor(e.message || e); });
}
function pintarZip(id, r) {
  V.zip = { id: id, nombre: r.nombre, entradas: r.entradas };
  $('v_nombre').textContent = r.nombre + ' · ' + r.entradas.length + ' documento(s)';
  $('v_volver').style.display = 'none';
  $('v_desc').disabled = false;
  $('v_desc').onclick = () => descargar(id);
  $('v_cuerpo').innerHTML = !r.entradas.length ? '<div class="sub">El ZIP está vacío.</div>' :
    '<div class="tarjeta" style="max-width:760px;margin:0 auto;text-align:left">' + r.entradas.map(e =>
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--fila)"><div style="min-width:0">' +
      '<div style="font:600 13px Archivo,sans-serif;word-break:break-all">' + h(e.nombre) + '</div><div class="sub">' + (e.mb < 0.01 ? '< 0,01' : h(e.mb)) + ' MB' + (e.vista === 'word' ? ' · se muestra convertido a PDF' : '') + '</div></div>' +
      (e.vista ? '<button class="prim" data-zent="' + e.i + '">Ver</button>' : '<span class="sub" style="flex-shrink:0">Descargue el ZIP</span>') + '</div>').join('') + '</div>';
  $('v_cuerpo').querySelectorAll('[data-zent]').forEach(b => b.onclick = () => {
    const e = V.zip.entradas[b.dataset.zent];
    ver(V.zip.id, e.nombre.split('/').pop(), e.i);
  });

async function pintarDocumento(r, n) {
  const cuerpo = $('v_cuerpo');
  if (r.tipo === 'pdf') {
    const lib = await cargarPdfjs();
    // isEvalSupported: false evita que una fuente maliciosa del PDF ejecute código (CVE-2024-4367).
    const doc = await lib.getDocument({ data: bytesDe(r.base64), isEvalSupported: false }).promise;
    if (n !== V.n) return;
    cuerpo.innerHTML = '';
    const ancho = Math.min(cuerpo.clientWidth - 32, 980), dpr = window.devicePixelRatio || 1;
    for (let i = 1; i <= doc.numPages; i++) {
      const pag = await doc.getPage(i);
      if (n !== V.n) return;
      const vp = pag.getViewport({ scale: ancho / pag.getViewport({ scale: 1 }).width * dpr });
      const c = document.createElement('canvas');
      c.width = vp.width; c.height = vp.height; c.style.width = Math.round(vp.width / dpr) + 'px';
      c.setAttribute('role', 'img'); c.setAttribute('aria-label', 'Página ' + i + ' de ' + doc.numPages);
      cuerpo.appendChild(c);
      await pag.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    }
  } else if (r.tipo === 'imagen') {
    cuerpo.innerHTML = '<img alt="' + h(r.nombre) + '" src="data:' + h(r.mime) + ';base64,' + r.base64 + '">';
  } else if (r.tipo === 'texto') {
    cuerpo.innerHTML = '<pre>' + h(new TextDecoder().decode(bytesDe(r.base64))) + '</pre>';
  } else {
    avisoVisor('Este tipo de archivo no se puede mostrar aquí. Use «Descargar».');
  }
}

      if ((c.omitidos || []).length) html += '<div class="aviso a-amb" style="margin-bottom:12px">Se enviará sin copia a: ' + h(c.omitidos.join('; ')) + ' (no está registrado). Puede completarlo en Configuración.</div>';
      if (c.faltantes.length) html += '<div class="aviso a-rojo" style="margin-bottom:12px">No se puede enviar: falta ' + h(c.faltantes.join('; ')) + '. Complételo en Configuración o Cuentas.</div>';
      html += '<div style="border:1px solid var(--borde);border-radius:12px;padding:14px 16px"><div class="sub" style="white-space:normal">Para: <b>' + h(c.para.join(', ') || '—') + '</b>' + (c.cc.length ? '<br>CC: ' + h(c.cc.join(', ')) : '') + '</div>' +
        '<label class="et" style="margin-top:10px" for="c_asunto">Asunto</label><input id="c_asunto" value="' + h(c.asunto) + '">' +
        '<label class="et" style="margin-top:10px" for="c_cuerpo">Cuerpo (puede editarlo para este envío)</label><textarea id="c_cuerpo" rows="12">' + h(c.cuerpo) + '</textarea>';
      const arch = (e.archivos || []).filter(a => a.categoria !== S.ini.categorias.antecedentes_formulario);
      if (arch.length) html += '<span class="et" style="margin-top:10px">Adjuntar</span>' + arch.map(a => '<label class="chk"><input type="checkbox" class="adj" value="' + h(a.id) + '" data-mb="' + h(a.tamano_mb) + '"> ' + h(a.nombre) + ' <span class="sub">(' + h(a.tamano_mb) + ' MB)</span></label>').join('') + '<div class="sub" id="totadj"></div>';
      html += '</div></div>';
    }
    html += '<div class="acciones" style="justify-content:flex-end;margin-top:16px"><button id="cancelar">Cancelar</button><button class="prim" id="confirmar"' + (pv.conCorreo && pv.correo.faltantes.length ? ' disabled' : '') + '>' + (pv.conCorreo ? 'Confirmar y enviar correo' : 'Confirmar cambio') + '</button></div>';
    $('dlg').innerHTML = html;
    $('cancelar').onclick = cerrarDlg;
    const textoConfirmar = () => pv.conCorreo && $('c_sincorreo') && $('c_sincorreo').checked ? 'Confirmar sin enviar correo' : pv.conCorreo ? 'Confirmar y enviar correo' : 'Confirmar cambio';
    if ($('c_sincorreo')) $('c_sincorreo').onchange = () => {
      const sin = $('c_sincorreo').checked;
      $('c_sincorreo_caja').style.display = sin ? 'block' : 'none';
      $('c_bloque_correo').style.display = sin ? 'none' : '';
      $('confirmar').textContent = textoConfirmar();
      $('confirmar').disabled = !sin && pv.correo.faltantes.length > 0;
    };
    // Los campos obligatorios se reflejan en vivo en el cuerpo del correo.
    if (pv.conCorreo) req.forEach(k => { const el = $('c_' + k); el.oninput = () => reflejar(pv); });
    if (req.length && pv.conCorreo) reflejar(pv);
    document.querySelectorAll('.adj').forEach(x => x.onchange = () => {
      const mb = [...document.querySelectorAll('.adj:checked')].reduce((s, y) => s + Number(y.dataset.mb || 0), 0);
      $('totadj').textContent = mb ? 'Total adjuntos: ' + mb.toFixed(1) + ' MB (máx. 24)' : '';
    });
    $('confirmar').onclick = () => {
      const campos = {};
      for (const k of req) { campos[k] = $('c_' + k).value.trim(); if (!campos[k]) return toast('Complete «' + (ROT_CAMPO[k] || k) + '»', true); }
      const envio = { campos };
      if (conResolucion && $('c_comentario').value.trim()) campos.comentario = $('c_comentario').value.trim();
      if (porOtroMedio) {
        campos.otro_medio = $('c_otro_medio').value.trim();
        if (!campos.otro_medio) return toast('Indique por qué medio y cuándo dio el V°B° el Vicedecano/a', true);
        envio.otroMedio = true;
      }
      if (pv.conCorreo && $('c_sincorreo').checked) { envio.sinCorreo = true; envio.motivoSinCorreo = $('c_sincorreo_motivo').value.trim(); }
      else if (pv.conCorreo) { envio.asunto = $('c_asunto').value; envio.cuerpo = $('c_cuerpo').value; envio.adjuntos = [...document.querySelectorAll('.adj:checked')].map(x => x.value); }
      const archivo = conResolucion && $('c_archivo').files[0];
      if (archivo && archivo.size > S.ini.maxMb * 1048576) return toast('El archivo supera ' + S.ini.maxMb + ' MB', true);
      $('confirmar').disabled = true; $('confirmar').textContent = archivo ? 'Subiendo resolución…' : 'Enviando…';
      // Primero se guarda el archivo (categoría «Resolución») y luego se cambia el estado.
      const subida = archivo ? new Promise((ok, mal) => {
        const lector = new FileReader();
        lector.onload = () => run('api_subirArchivo', e.folio, archivo.name, archivo.type, String(lector.result).split(',')[1], 'resolucion').then(ok, mal);
        lector.onerror = () => mal(new Error('No se pudo leer el archivo.'));
        lector.readAsDataURL(archivo);
      }) : Promise.resolve();
      subida.then(() => run('api_cambiarEstado', e.folio, hacia, envio)).then(r => {
        cerrarDlg(); toast(r.conCorreo ? 'Estado actualizado y correo enviado' : r.sinCorreo ? 'Estado actualizado, sin enviar correo' : 'Estado actualizado');
        abrir(e.folio).then(() => {
          if (r.pdfSolicitud && r.pdfSolicitud.existente) ofrecerPdfSolicitud(r.pdfSolicitud, 'El PDF del formulario de solicitud ya había sido generado el ' + r.pdfSolicitud.fecha + ' por ' + r.pdfSolicitud.por + '; no se generó otro. Está en «Archivos del expediente».', 'PDF ya generado');
          else if (r.pdfSolicitud) ofrecerPdfSolicitud(r.pdfSolicitud, 'Se generó el PDF del formulario de solicitud antes de pasar a Informe de Registro Curricular. Quedó en «Archivos del expediente».');
          else if (conResolucion) avisoDistribucion();
        });
      }).catch(err => { fallo(err); $('confirmar').disabled = false; $('confirmar').textContent = textoConfirmar(); });
    };
  }).catch(err => { cerrarDlg(); fallo(err); });
}
function reflejar(pv) {
  const vars = { motivo: 'motivo', observacion: 'observacion', propuesta_comite: 'propuesta_comite', resolucion: 'resolucion' };
  let cuerpo = pv.correo.cuerpo, asunto = pv.correo.asunto;
  Object.keys(vars).forEach(k => {
    const el = $('c_' + k); if (!el || !el.value.trim()) return;
    cuerpo = cuerpo.split('{' + k + '}').join(el.value.trim()); asunto = asunto.split('{' + k + '}').join(el.value.trim());
  });
  $('c_cuerpo').value = cuerpo; $('c_asunto').value = asunto;
}

/* ── Indicadores ── */
function pintarIndicadores() {
  const l = S.bandeja, anio = String(new Date().getFullYear());
  const delAnio = l.filter(s => String(s.folio).slice(-4) === anio);
  const cerradas = delAnio.filter(s => cierre(s.estado));
  const kpi = (n, t, c) => '<div class="kpi" style="--c:' + c + '"><b>' + n + '</b><span>' + t + '</span></div>';
  const barras = (titulo, pares) => { const max = Math.max(1, ...pares.map(p => p[1])); return '<div class="tarjeta"><h3>' + titulo + '</h3>' + pares.map(p => '<div style="display:flex;justify-content:space-between;font:400 12.5px Archivo,sans-serif"><span>' + h(p[0]) + '</span><span class="mono">' + p[1] + '</span></div><div class="barra"><i style="width:' + (100 * p[1] / max) + '%"></i></div>').join('') + '</div>'; };
  const contar = f => { const m = {}; delAnio.forEach(s => f(s).forEach(k => { if (k) m[k] = (m[k] || 0) + 1; })); return Object.entries(m).sort((a, b) => b[1] - a[1]); };
  $('app').innerHTML = '<h2>Indicadores ' + anio + '</h2><div class="resumen" style="margin-bottom:16px">Solicitudes con folio del año en curso. «Cerradas» incluye resueltas, rechazadas, no procede y negadas.</div>' +
    '<div class="kpis">' + kpi(delAnio.length, 'Solicitudes recibidas', 'var(--teal2)') + kpi(delAnio.length - cerradas.length, 'En curso', 'var(--naranja)') +
    kpi(cerradas.length + ' <small style="font-size:14px">(' + cerradas.filter(s => s.estado === 'resuelto').length + ' favorables)</small>', 'Cerradas', 'var(--verde)') +
    kpi(delAnio.filter(s => s.revisar === 'SÍ').length, 'Por revisar', '#C9C2B0') + '</div>' +
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:16px">' +
    barras('Por estado', contar(s => [etq(s.estado)])) + barras('Por programa', contar(s => [s.programa])) +
    barras('Por tipo de requerimiento', contar(s => String(s.tipo).split(',').map(x => x.trim()))) + '</div>';
}

/* ── Panorama: avance de cada caso en su ruta de pasos (Vicedecanato y Registro Curricular) ── */
function cargarPanorama() {
  $('app').innerHTML = '<div class="cargando">Cargando panorama…</div>';
  run('api_panorama').then(r => { S.pan = r; S.panF = S.panF || { fase: '', programa: '', q: '' }; pintarPanorama(); }).catch(fallo);
}
function pintarPanorama() {
  const r = S.pan, f = S.panF;
  const NEG = ['rechazada', 'no_procede', 'negado', 'rechazo_vb'];
  const programas = [...new Set(r.casos.map(c => c.programa).filter(Boolean))].sort();
  const base = r.casos.filter(c => (!f.programa || c.programa === f.programa) &&
    (!f.q || (c.folio + ' ' + c.nombre).toLowerCase().indexOf(f.q.toLowerCase()) >= 0));
  // Sin filtro de fase se muestran los casos en curso; «Cierre» muestra los cerrados.
  const lista = base.filter(c => f.fase ? c.fase === f.fase : !c.cerrado)
    .sort((a, b) => r.fases.indexOf(a.fase) - r.fases.indexOf(b.fase) || (b.diasHabiles || 0) - (a.diasHabiles || 0));
  const n = fase => base.filter(c => fase ? c.fase === fase : !c.cerrado).length;
  const chip = (val, txt) => '<button class="chipf' + (f.fase === val ? ' act' : '') + '" data-fase="' + h(val) + '">' + h(txt) + '<span>' + n(val) + '</span></button>';
  const pista = c => {
    const neg = NEG.indexOf(c.estado) >= 0;
    return '<div class="track" aria-hidden="true">' + c.ruta.map((p, k) => (k ? '<b class="' + (p.situacion !== 'pendiente' ? 'h' : '') + '"></b>' : '') +
      '<i class="' + (p.situacion === 'hecho' ? 'h' : p.situacion === 'actual' ? (neg ? 'n' : 'a') : '') + '" title="' + h(p.etiqueta) + '"></i>').join('') + '</div>';
  };
  const filas = lista.map(c => {
    const k = c.ruta.findIndex(p => p.situacion === 'actual');
    return '<div class="prow" tabindex="0" data-f="' + h(c.folio) + '" aria-label="Abrir expediente ' + h(c.folio) + '">' +
      '<div style="min-width:0"><div class="mono" style="font-size:11.5px;color:var(--apagado)">' + h(c.folio) + '</div><div class="nom">' + h(c.nombre || '—') + '</div></div>' +
      '<div class="sub" style="min-width:0">' + h(c.programa) + (c.tipo ? '<br>' + h(c.tipo) : '') + '</div>' +
      '<div style="min-width:0">' + pista(c) + '<div class="sub">Paso ' + (k + 1) + ' de ' + c.ruta.length + ' · ' + h(c.fase) + '</div></div>' +
      '<div style="min-width:0">' + tag(c.estado) + '<div class="sub" style="margin-top:4px">' +
        (c.cerrado ? 'Cerrado ' + fecha(c.estado_desde) : (c.diasHabiles === null ? '' : c.diasHabiles + ' día(s) hábil(es) en este paso')) +
        (c.analistaNombre ? '<br>Analista: ' + h(c.analistaNombre) : '') + '</div></div></div>';
  }).join('') || '<div class="sub" style="padding:20px">No hay casos con estos filtros.</div>';
  $('app').innerHTML = '<h2>Panorama de avance</h2><div class="resumen" style="margin-top:4px">Cada caso con su ruta de pasos: verde = cumplido, naranjo = paso actual, rojo = cierre desfavorable. Se muestran los programas que su cuenta puede ver; haga clic en un caso para abrir su expediente.</div>' +
    '<div class="pan-f">' + chip('', 'En curso') + r.fases.map(x => chip(x, x)).join('') +
    '<select id="pan_prog" aria-label="Programa" style="width:auto;min-width:180px"><option value="">Todos los programas</option>' + programas.map(p => '<option' + (p === f.programa ? ' selected' : '') + '>' + h(p) + '</option>').join('') + '</select>' +
    '<input id="pan_q" placeholder="Buscar folio o nombre" value="' + h(f.q) + '" style="width:auto;min-width:200px;flex:1"></div>' +
    '<div class="tabla">' + filas + '</div>';
  document.querySelectorAll('[data-fase]').forEach(b => b.onclick = () => { f.fase = b.dataset.fase; pintarPanorama(); });
  $('pan_prog').onchange = e => { f.programa = e.target.value; pintarPanorama(); };
  $('pan_q').oninput = e => { f.q = e.target.value; const pos = e.target.selectionStart; pintarPanorama(); $('pan_q').focus(); $('pan_q').setSelectionRange(pos, pos); };
  document.querySelectorAll('.prow').forEach(row => { row.onclick = () => abrir(row.dataset.f); row.onkeydown = ev => { if (ev.key === 'Enter') abrir(row.dataset.f); }; });
}

    '<div><label class="et" for="k_nivel">Nivel</label><select id="k_nivel">' + r.niveles.map(x => '<option value="' + x + '"' + (x === v.nivel ? ' selected' : '') + '>' + h(NIV[x]) + '</option>').join('') + '</select></div></div>' +
    '<span class="et" style="margin-top:12px">Programas que ve</span><label class="chk"><input type="checkbox" id="k_todos"' + (progSel[0] === 'todos' ? ' checked' : '') + '> Todos</label>' +
    '<div id="k_progs" style="max-height:150px;overflow:auto;' + (progSel[0] === 'todos' ? 'display:none' : '') + '">' + r.programas.map(p => '<label class="chk"><input type="checkbox" class="kp" value="' + h(p) + '"' + (progSel.indexOf(p) >= 0 ? ' checked' : '') + '> ' + h(p) + '</label>').join('') + '</div>' +
    '<span class="et" style="margin-top:12px">Recibe copia de estos correos (además de los de su rol)</span><div style="max-height:150px;overflow:auto">' +
    r.eventos.map(ev => '<label class="chk"><input type="checkbox" class="ke" value="' + h(ev) + '"' + (evs.indexOf(ev) >= 0 ? ' checked' : '') + '> <span style="font-size:12.5px">' + h((r.eventosDesc || {})[ev] || ev) + '</span> <span class="mono sub" style="font-size:10.5px">' + h(ev) + '</span></label>').join('') + '</div>' +
    '<label class="chk" style="margin-top:10px"><input type="checkbox" id="k_activo"' + (v.activo === 'SÍ' ? ' checked' : '') + '> Cuenta activa</label>' +
    '<label class="et" style="margin-top:10px" for="k_notas">Notas</label><input id="k_notas" value="' + h(v.notas) + '">' +
    '<div id="k_resumen" style="margin-top:14px">' + tarjetaResumenCuenta(nueva ? null : resDe(v)) + '</div>' +
    (!nueva && (r.duplicadas || []).indexOf(String(v.correo).trim().toLowerCase()) >= 0 ? '<div class="aviso a-amb" style="white-space:normal;margin-top:10px">Hay más de un registro con este correo (fila ' + h(v.fila) + ' de la hoja «Cuentas»). Al ingresar se usa el primero; elimine el sobrante.</div>' : '') +
    '<div class="acciones" style="justify-content:flex-end;margin-top:14px">' + (nueva ? '' : '<button id="k_eliminar" style="margin-right:auto;color:#8A3D2E">Eliminar</button><button id="k_nueva">Nueva cuenta</button><button id="k_aviso">Enviar enlace de acceso</button>') + '<button class="prim" id="k_guardar">' + (nueva ? 'Crear cuenta' : 'Guardar') + '</button></div></div>';
  $('app').innerHTML = '<h2>Cuentas</h2><div class="resumen" style="margin-bottom:16px">El ingreso es con la cuenta Google USACH; aquí se decide qué puede hacer cada persona y qué correos recibe. Los cambios rigen desde la siguiente acción de esa persona. La cuenta institucional (' + h(r.duenia) + ') es administradora fija.</div>' +
    '<div class="pan-f">' + [['', 'Todas'], ['vi', 'Vicedecanato'], ['rc', 'Registro Curricular']].map(g => '<button class="chipf' + (grupo === g[0] ? ' act' : '') + '" data-grupo="' + g[0] + '">' + g[1] + '<span>' + r.cuentas.filter(c => !g[0] || (g[0] === 'rc') === (r.rolesRC || []).indexOf(c.rol) >= 0).length + '</span></button>').join('') + '</div>' +
    (grupo === 'rc' ? '<div class="aviso a-teal" style="white-space:normal;margin-bottom:12px"><b>Cuentas de Registro Curricular.</b> Tres tipos de cuenta (rol): «Registro Curricular» para la registradora curricular; «Analista de Registro Curricular» para sus analistas; y «Cuenta de Registro Curricular del programa» para el correo de RC propio de un programa. Las analistas y las cuentas de programa se asignan a cada programa en Configuración, y reciben copia de las comunicaciones de sus casos; lo que recibe una analista llega también a Registro Curricular. ' +
      '«Programas que ve» = Todos, o solo los programas de esa cuenta (cuenta por programa: recibe copias y ve casos solo de esos programas). ' +
      'Nivel «Consulta» para ver el Panorama y los expedientes (sin fundamentación ni archivos); «Sin acceso» para recibir solo copias. ' +
      'En «Recibe copia de estos correos» marque los mensajes que debe recibir (p. ej., CAE admisible y CAE rechazada).</div>' : '') +
    '<div class="grid2"><div class="tabla">' + (filas || '<div class="sub" style="padding:16px">Sin cuentas en este grupo.</div>') + '</div><div class="lado">' + form + '</div></div>';
  document.querySelectorAll('[data-grupo]').forEach(b => b.onclick = () => { S.ctaGrupo = b.dataset.grupo; pintarCuentas(); });
  document.querySelectorAll('[data-ed]').forEach(b => b.onclick = () => pintarCuentas(b.dataset.ed));
  const datosForm = () => ({ correo: $('k_correo').value, nombre: $('k_nombre').value, rol: $('k_rol').value, nivel: $('k_nivel').value,
    programas: $('k_todos').checked ? 'todos' : [...document.querySelectorAll('.kp:checked')].map(x => x.value).join('; '),
    activo: $('k_activo').checked ? 'SÍ' : 'NO', recibe_eventos: [...document.querySelectorAll('.ke:checked')].map(x => x.value).join(', '), notas: $('k_notas').value });
  // La tarjeta «ve y recibe» se recalcula con las reglas del servidor cada vez que cambia el formulario (sin guardar).
  const refrescarResumen = () => {
    clearTimeout(refrescarResumen._t);
    refrescarResumen._t = setTimeout(() => {
      const d = datosForm(), marca = JSON.stringify(d);
      refrescarResumen._marca = marca;
      run('api_resumenCuenta', d).then(rs => { if (refrescarResumen._marca === marca && $('k_resumen')) $('k_resumen').innerHTML = tarjetaResumenCuenta(rs); }).catch(fallo);
    }, 350);
  };
  $('k_todos').onchange = e => { $('k_progs').style.display = e.target.checked ? 'none' : ''; refrescarResumen(); };
  ['k_rol', 'k_nivel', 'k_activo', 'k_correo'].forEach(id => { $(id).onchange = refrescarResumen; });
  document.querySelectorAll('.kp, .ke').forEach(x => { x.onchange = refrescarResumen; });
  if (nueva) refrescarResumen();
  if ($('k_nueva')) $('k_nueva').onclick = () => pintarCuentas();
  if ($('k_aviso')) $('k_aviso').onclick = () => run('api_avisarCuenta', v.correo).then(() => toast('Enlace enviado a ' + v.correo)).catch(fallo);
  if ($('k_eliminar')) $('k_eliminar').onclick = () => {
    if (!confirm('¿Eliminar el registro de ' + v.correo + ' (fila ' + v.fila + ')? La persona pierde el acceso y las copias de esta cuenta. Quedará anotado en la bitácora.\n\nSi solo quiere suspenderla, desmarque «Cuenta activa» en vez de eliminar.')) return;
    $('k_eliminar').disabled = true;
    run('api_eliminarCuenta', v.correo, v.fila).then(res => { toast('Cuenta eliminada' + (res.quedan ? ' · quedan ' + res.quedan + ' registro(s) con ese correo' : '')); cargarCuentas(); })
      .catch(err => { fallo(err); $('k_eliminar').disabled = false; });
  };
  $('k_guardar').onclick = () => {
    const datos = datosForm();
    if (!datos.programas) return toast('Seleccione al menos un programa o «Todos»', true);
    // Un doble clic no debe crear dos registros: el botón se bloquea hasta que el servidor responda.
    const b = $('k_guardar'); if (b.disabled) return;
    b.disabled = true; b.textContent = nueva ? 'Creando…' : 'Guardando…';
    run('api_guardarCuenta', datos, nueva).then(res => {
      toast(res.sinCambios ? 'Sin cambios' : nueva ? 'Cuenta creada' : 'Cuenta actualizada');
      if (nueva && confirm('¿Enviar a ' + datos.correo.trim().toLowerCase() + ' el enlace de acceso al panel?')) run('api_avisarCuenta', datos.correo.trim().toLowerCase()).then(() => toast('Enlace enviado')).catch(fallo);
      cargarCuentas();
    }).catch(err => { fallo(err); b.disabled = false; b.textContent = nueva ? 'Crear cuenta' : 'Guardar'; });
  };
}

/* ── Verificación de la migración (Configuración → Migración) ──
   La verificación tarda varios segundos; la respuesta puede llegar cuando ya se cambió de pestaña y el botón no existe. */
function botonMig(texto, deshabilitado) { const b = $('mig_ok'); if (b) { b.disabled = deshabilitado; b.textContent = texto; } }
function verificarMigracionPanel() {
  botonMig('Verificando…', true);
  run('api_verificarMigracion').then(v => { botonMig('Verificar migración', false); mostrarVerificacion(v); })
    .catch(err => { fallo(err); botonMig('Verificar migración', false); });
}
function mostrarVerificacion(v) {
  const r = v.resumen;
  const huerfanas = v.diferencias.filter(d => d.campo === 'solicitud').length;
  const colisiones = v.diferencias.filter(d => d.campo === 'fila_respuesta').length; // misma fila, fila vacía o inexistente
  const filas = v.diferencias.map(d => '<tr><td class="mono">' + h(d.fila) + '</td><td class="mono">' + h(d.folio) + '</td><td>' + h(d.campo) + '</td><td>' + h(d.original) + '</td><td>' + h(d.sistema) + '</td><td class="sub" style="white-space:normal">' + h(d.tipo) + (d.nota ? ' · ' + h(d.nota) : '') + '</td></tr>').join('');
  $('dlg').innerHTML = '<div class="kicker" style="color:var(--apagado)">Verificación de la migración</div><h3 style="margin-top:6px">' + r.filas + ' filas con datos · ' + r.migradas + ' con solicitud · ' + r.nuevas + ' del formulario web</h3>' +
    '<div class="aviso ' + (r.formulario ? 'a-amb' : 'a-teal') + '" style="white-space:normal;margin:10px 0">' + (r.diferencias ? r.diferencias + ' diferencia(s): <b>' + r.formulario + '</b> en datos del formulario y ' + r.gestion + ' en datos de gestión (estado, analista, N° STD, comentarios, resolución), que pueden haberse editado después en el panel.' : 'Sin diferencias: la planilla original y el sistema coinciden.') + ' El detalle quedó en la hoja «' + h(v.hoja) + '» de la planilla.</div>' +
    (filas ? '<div style="max-height:50vh;overflow:auto"><table style="width:100%;border-collapse:collapse;font:400 12px Archivo,sans-serif"><thead><tr style="text-align:left"><th>Fila</th><th>Folio</th><th>Campo</th><th>Planilla original</th><th>Sistema</th><th>Tipo · nota</th></tr></thead><tbody>' + filas + '</tbody></table></div>' : '') +
    (r.formulario ? '<div class="aviso a-teal" style="white-space:normal;margin-top:10px">Si las diferencias se repiten fila tras fila (los datos del sistema coinciden con la fila siguiente o anterior), en la hoja de respuestas se insertaron, borraron u ordenaron filas después de la migración. «Realinear filas» vuelve a enlazar cada solicitud con su fila por correo verificado o nombre, sin tocar los datos.</div>' : '') +
    (colisiones ? '<div class="aviso a-rojo" style="white-space:normal;margin-top:10px">' + colisiones + ' solicitud(es) apuntan a una fila repetida, vacía o inexistente. «Reparar importación» elimina las solicitudes importadas que solo duplican un folio atascado (sin trámite propio), restaura el folio en la planilla y realinea; luego, si quedan filas sin solicitud, podrá importarlas.</div>' : '') +
    (huerfanas && !colisiones ? '<div class="aviso a-amb" style="white-space:normal;margin-top:10px">' + huerfanas + ' fila(s) de la hoja de respuestas sin solicitud en el sistema. «Importar filas» crea una solicitud por cada una con el estado que tenga la planilla, marcada «Por revisar» y sin correo al estudiante; si el folio ya está en uso se asigna el siguiente y se anota el original. Realinee primero.</div>' : '') +
    '<div class="acciones" style="justify-content:flex-end;margin-top:14px">' + (r.formulario ? '<button id="mig_realinear">Realinear filas</button>' : '') + (colisiones ? '<button id="mig_reparar" class="ambar">Reparar importación</button>' : '') + (huerfanas && !colisiones ? '<button id="mig_importar">Importar ' + huerfanas + ' fila(s)</button>' : '') + '<button class="prim" id="mig_cerrar">Cerrar</button></div>';
  $('fondo').style.display = 'flex'; $('mig_cerrar').onclick = cerrarDlg;
  const brp = $('mig_reparar');
  if (brp) brp.onclick = () => {
    if (!confirm('¿Reparar? Se eliminarán las solicitudes importadas que solo duplican un folio atascado (sin trámite propio) y se realinearán las filas. Quedará en la bitácora.')) return;
    brp.disabled = true; brp.textContent = 'Reparando…';
    run('api_repararImportacion').then(x => {
      toast((x.deshechas.length ? 'Eliminadas ' + x.deshechas.map(d => d.folio).join(', ') + ' · ' : 'Nada que eliminar · ') + x.realineado.realineadas.length + ' realineada(s)' + (x.realineado.pendientes.length ? ' · ' + x.realineado.pendientes.length + ' sin resolver' : ''));
      cerrarDlg(); verificarMigracionPanel();
    }).catch(err => { fallo(err); if (document.body.contains(brp)) { brp.disabled = false; brp.textContent = 'Reparar importación'; } });
  };
  const bi = $('mig_importar');
  if (bi) bi.onclick = () => {
    if (!confirm('¿Crear ' + huerfanas + ' solicitud(es) a partir de las filas sin solicitud? Quedarán «Por revisar»; no se envía ningún correo.')) return;
    bi.disabled = true; bi.textContent = 'Importando…';
    run('api_importarFilasSinSolicitud').then(x => {
      toast(x.importadas.length + ' solicitud(es) importada(s): ' + x.importadas.map(i => i.folio).join(', '));
      cerrarDlg(); verificarMigracionPanel();
    }).catch(err => { fallo(err); if (document.body.contains(bi)) { bi.disabled = false; bi.textContent = 'Importar ' + huerfanas + ' fila(s)'; } });
  };
  const br = $('mig_realinear');
  if (br) br.onclick = () => {
    br.disabled = true; br.textContent = 'Realineando…';
    run('api_realinearMigracion').then(x => {
      toast(x.realineadas.length + ' solicitud(es) realineada(s)' + (x.pendientes.length ? ' · ' + x.pendientes.length + ' sin resolver' : ''));
      if (x.filasSinSolicitud.length) toast('Filas sin solicitud en el sistema: ' + x.filasSinSolicitud.join(', '), true);
      cerrarDlg(); verificarMigracionPanel(); // vuelve a verificar aunque ya no se esté en Configuración
    }).catch(err => { fallo(err); if (document.body.contains(br)) { br.disabled = false; br.textContent = 'Realinear filas'; } });
  };
}

/* ── Configuración ── */
function tarjetaFeriados(f) {
  f = f || {};
  const fuente = /official/.test(f.fuente || '') ? 'calendario oficial de feriados de Chile (Google)' : f.fuente ? 'calendario de feriados de Chile (Google)' : '';
  const lista = (f.proximos || []).map(x => '<div style="display:flex;gap:10px;margin-bottom:4px"><span class="mono" style="font-size:11.5px;min-width:84px">' + h(fecha(x.fecha + 'T12:00:00')) + '</span><span class="sub" style="white-space:normal">' + h(x.titulo) + '</span></div>').join('');
  return '<div class="tarjeta"><h3>Feriados (automáticos)</h3>' +
    (f.total ? lista : '<div class="resumen">Aún no hay feriados cargados: los plazos cuentan de lunes a viernes.</div>') +
    '<div class="sub" style="white-space:normal;margin-top:10px">Se obtienen solos' + (fuente ? ' del ' + fuente : '') + ' y se renuevan cada mes; no requieren mantenimiento.' +
    (f.actualizado ? ' Última actualización: ' + h(fecha(f.actualizado)) + '.' : '') + '</div>' +
    (f.error ? '<div class="aviso a-amb" style="margin-top:8px">No se pudo consultar el calendario en el último intento' + (f.total ? '; se usa la lista guardada' : '') + '.</div>' : '') + '</div>';
}
function cargarConfig() {
  $('app').innerHTML = '<div class="cargando">Cargando configuración…</div>';
  run('api_config').then(r => { S.config = r; pintarConfig(); }).catch(fallo);
}
// Solo lectura: replica la cuenta activa con rol Vicedecano/a. Se cambia en «Cuentas» (nombre, rol o activo), no aquí.
function tarjetaVicedecano(v) {
  v = v || {};
  const aviso = !v.activas ? '<div class="sub" style="white-space:normal;color:var(--alerta,#9a5b00)">No hay cuenta activa con rol Vicedecano/a: nadie puede registrar el V°B° directamente.</div>'
    : v.activas > 1 ? '<div class="sub" style="white-space:normal;color:var(--alerta,#9a5b00)">Hay ' + v.activas + ' cuentas activas con rol Vicedecano/a; se muestra la primera. Deje solo una en «Cuentas».</div>' : '';
  return '<div class="tarjeta" id="vd_tarjeta"><h3>Vicedecano/a</h3>' +
    '<div class="et">Nombre (aparece en los correos)</div><div id="vd_nombre" style="margin-bottom:8px">' + h(v.nombre || '—') + '</div>' +
    '<div class="et">Cuenta</div><div id="vd_correo" class="mono" style="margin-bottom:8px">' + h(v.correo || '—') + '</div>' + aviso +
    '<div class="sub" style="white-space:normal;margin-top:6px">Se toma de la cuenta con rol Vicedecano/a. Para cambiarlo, edite esa cuenta en «Cuentas».</div></div>';
}
function selRC(i, k, valor, lista, vacio) {
  lista = (lista || []).slice();
  if (valor && !lista.some(c => c.correo === valor)) lista.push({ correo: valor, nombre: valor + ' (sin cuenta activa)' });
  return '<span style="display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center"><select data-i="' + i + '" data-k="' + k + '" data-rc="1" style="width:auto;min-width:220px;font-size:12.5px" aria-label="' + h(vacio.split(':')[0]) + '"><option value="">' + h(vacio) + '</option>' +
    lista.map(c => '<option value="' + h(c.correo) + '"' + (c.correo === valor ? ' selected' : '') + '>' + h(c.nombre) + '</option>').join('') +
    '<option value="__nueva">+ Añadir nueva (' + h(vacio.split(':')[0]) + ')…</option></select>' +
    '<span data-nueva="' + i + '-' + k + '" style="display:none;gap:6px;flex-wrap:wrap"><input data-nn="' + i + '-' + k + '" placeholder="Nombre · ' + h(vacio.split(':')[0]) + '" aria-label="Nombre · ' + h(vacio.split(':')[0]) + '" style="width:230px;font-size:12.5px">' +
    '<input data-nc="' + i + '-' + k + '" class="mono" placeholder="correo@usach.cl" aria-label="Correo de la nueva cuenta" style="width:200px;font-size:12.5px"></span></span>';
}
function pintarConfig() {
  const r = S.config, adm = nivel('administracion'), ed = nivel('edicion');

    (adm ? '<input data-i="' + i + '" data-k="correo_direccion" class="mono" style="font-size:12px" value="' + h(p.correo_direccion) + '" placeholder="dirección@usach.cl">' +
      '<select data-i="' + i + '" data-k="analista"><option value="">Sin asignar</option>' + S.ini.analistas.map(a => '<option value="' + h(a.correo) + '"' + (a.correo === p.analista ? ' selected' : '') + '>' + h(a.nombre) + '</option>').join('') + '</select>' +

      : ed ? '<input data-i="' + i + '" data-k="correo_direccion" class="mono" style="font-size:12px" value="' + h(p.correo_direccion) + '" placeholder="dirección@usach.cl" aria-label="Correo de dirección de ' + h(p.programa) + '">' +
        '<div class="sub">' + h(p.analista || '—') + '</div><div class="sub">' + h(p.activo) + '</div><button data-gc="' + i + '" style="padding:6px 9px">Guardar</button>'
      : '<div class="sub mono">' + h(p.correo_direccion || '—') + '</div><div class="sub">' + h(p.analista || '—') + '</div><div class="sub">' + h(p.activo) + '</div><div></div>') +
    // Registro Curricular del programa: reciben copia de las comunicaciones del caso (parámetro eventos_copia_rc).
    '<div style="grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:-2px">' +
      '<span class="et" style="margin:0">Registro Curricular</span>' +
      (adm ? selRC(i, 'analista_rc', p.analista_rc, r.analistasRC, 'Analista de RC: sin asignar') + selRC(i, 'cuenta_rc', p.cuenta_rc, r.cuentasRC, 'Cuenta RC del programa: sin asignar')

  const pars = r.parametros.map(p => '<div style="margin-bottom:12px"><label class="et" for="p_' + h(p.clave) + '">' + h(p.clave) + '</label><input id="p_' + h(p.clave) + '" data-clave="' + h(p.clave) + '" value="' + h(p.valor) + '"' + (adm ? '' : ' disabled') + '><div class="sub" style="white-space:normal">' + h(p.descripcion) + '</div></div>').join('');
  $('app').innerHTML = '<h2>Configuración</h2><div class="resumen" style="margin-bottom:16px">Cada programa define a quién llegan los correos para «Dirección de programa», qué analista recibe las solicitudes nuevas y qué analista y cuenta de Registro Curricular reciben copia de las comunicaciones del caso (las listadas en el parámetro <span class="mono">eventos_copia_rc</span>; lo que recibe la analista de Registro Curricular llega también a Registro Curricular). Las cuentas de Registro Curricular se crean en «Cuentas».</div>' +
    '<div class="grid2"><div class="pila"><div class="tabla"><div class="fila enc" style="grid-template-columns:1.5fr 1.2fr 1fr 60px 70px"><div>Programa</div><div>Correo dirección</div><div>Analista</div><div>Activo</div><div></div></div>' + filas + '</div>' +
    (adm ? '<div class="tarjeta"><h3>Agregar programa</h3><div style="display:grid;grid-template-columns:1.5fr 1fr auto;gap:8px"><input id="np_nombre" placeholder="Nombre exacto, como aparece en el Formulario"><input id="np_correo" class="mono" placeholder="dirección@usach.cl"><button class="prim" id="np_ok">Agregar</button></div><div class="sub" style="white-space:normal;margin-top:6px">Si agrega un programa aquí, agréguelo también como opción en el Formulario de Google.</div></div>' : '') +
    '</div><div class="lado pila"><div class="tarjeta"><h3>Parámetros</h3>' + pars + (adm ? '<button class="prim" id="par_ok" style="width:100%">Guardar parámetros</button>' : '') + '</div>' +
    tarjetaVicedecano(r.vicedecano) +
    (adm ? '<div class="tarjeta" id="mig_tarjeta"><h3>Migración</h3><div class="sub" style="white-space:normal;margin-bottom:10px">Compara cada fila de la planilla original (hoja de respuestas) con su solicitud en el sistema: datos del formulario y datos de gestión.</div><button id="mig_ok" style="width:100%">Verificar migración</button></div>' : '') +
    tarjetaFeriados(r.feriados) + '</div></div>';
  document.querySelectorAll('[data-gc]').forEach(b => b.onclick = () => {
    const i = b.dataset.gc, el = document.querySelector('[data-i="' + i + '"][data-k="correo_direccion"]');
    run('api_guardarCorreoPrograma', r.programas[i].programa, el.value).then(() => { toast('Correo de dirección guardado'); cargarConfig(); }).catch(fallo);
  });
  if (!adm) return;
  $('mig_ok').onclick = verificarMigracionPanel;
  document.querySelectorAll('select[data-rc]').forEach(sel => sel.onchange = () => {
    const caja = document.querySelector('[data-nueva="' + sel.dataset.i + '-' + sel.dataset.k + '"]');
    const nueva = sel.value === '__nueva';
    caja.style.display = nueva ? 'inline-flex' : 'none';
    if (nueva) caja.querySelector('input').focus();
  });
  document.querySelectorAll('[data-gp]').forEach(b => b.onclick = () => {
    const i = b.dataset.gp, p = Object.assign({}, r.programas[i]);
    document.querySelectorAll('[data-i="' + i + '"]').forEach(el => { p[el.dataset.k] = el.type === 'checkbox' ? (el.checked ? 'SÍ' : 'NO') : el.value; });
    for (const k of ['analista_rc', 'cuenta_rc']) {
      if (p[k] !== '__nueva') continue;
      const nn = document.querySelector('[data-nn="' + i + '-' + k + '"]').value.trim(), nc = document.querySelector('[data-nc="' + i + '-' + k + '"]').value.trim();
      if (!nn || !nc) return toast('Escriba nombre y correo de la nueva cuenta de Registro Curricular', true);
      p['nuevo_' + k] = { nombre: nn, correo: nc }; p[k] = '';
    }
    run('api_guardarPrograma', p, false).then(() => { toast('Programa guardado'); cargarConfig(); }).catch(fallo);
  });
  $('np_ok').onclick = () => run('api_guardarPrograma', { programa: $('np_nombre').value, correo_direccion: $('np_correo').value, analista: '', activo: 'SÍ' }, true).then(() => { toast('Programa agregado'); cargarConfig(); }).catch(fallo);
  $('par_ok').onclick = () => {
    const v = {}; document.querySelectorAll('[data-clave]').forEach(el => { v[el.dataset.clave] = el.value; });
    run('api_guardarParametros', v).then(() => { toast('Parámetros guardados'); cargarConfig(); }).catch(fallo);
  };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('visor').classList.contains('abierto')) cerrarVisor(); else cerrarDlg(); } });
$('v_cerrar').onclick = cerrarVisor;
$('v_volver').onclick = () => { if (V.zip) pintarZip(V.zip.id, V.zip); };
$('visor').onclick = e => { if (e.target === $('visor')) cerrarVisor(); };
</script>
</body>
</html>
