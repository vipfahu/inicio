<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Spectral:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--tinta:#3A4450;--tinta2:#5A6470;--apagado:#8A8272;--borde:#E8E4DA;--campo:#E0DCD0;--fcampo:#FAF9F5;--teal:#007E80;--teal2:#00A0A0;--naranja:#EF7A00}
  *{box-sizing:border-box}
  body{margin:0;background:#F6F4EF;color:var(--tinta);font-family:Spectral,Georgia,serif}
  a{color:var(--teal)}
  header{background:#fff;border-bottom:1px solid var(--borde);padding:18px clamp(16px,5vw,60px);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
  .marca{display:flex;align-items:center;gap:14px;text-decoration:none}
  .marca img{height:64px}
  .tit{font:800 17px Archivo,sans-serif;color:var(--teal)} .sub{font:400 12px Archivo,sans-serif;color:var(--apagado)}
  .navp{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .navp a{font:600 11px Archivo,sans-serif;background:#F6F4EF;border:1px solid var(--campo);border-radius:8px;padding:8px 12px;text-decoration:none;color:var(--tinta)}
  .navp a.act{border-color:var(--teal2);color:var(--teal)}
  .navp a.discreto{background:none;border:0;color:var(--apagado)}
  main{max-width:820px;margin:0 auto;padding:40px clamp(16px,5vw,24px) 70px}
  .kicker{font:600 11px Archivo,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--naranja)}
  h1{font:800 clamp(26px,3.8vw,36px)/1.12 Archivo,sans-serif;margin:10px 0 14px}
  .intro{font:400 16px/1.6 Spectral,serif;color:var(--tinta2);margin:0 0 10px}
  .nota{font:400 13px/1.6 Spectral,serif;color:var(--apagado)}
  .seccion{background:#fff;border:1px solid var(--borde);border-top:4px solid var(--c);border-radius:14px;padding:26px 26px 24px;margin-top:22px}
  .seccion h2{font:800 19px Archivo,sans-serif;margin:0;display:flex;justify-content:space-between}
  .seccion h2 span{font:600 12px 'IBM Plex Mono',monospace;color:var(--apagado)}
  .seccion .desc{font:400 14px Spectral,serif;color:var(--tinta2);margin:6px 0 18px}
  label.et{display:block;font:700 9.5px Archivo,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--apagado);margin:14px 0 6px}
  label.et b{color:var(--naranja)}
  input,select,textarea{width:100%;padding:11px 14px;border:1.5px solid var(--campo);border-radius:9px;font:400 13px Archivo,sans-serif;background:var(--fcampo);color:var(--tinta)}
  textarea{font:400 14px/1.6 Spectral,serif;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal2)}
  .mono{font-family:'IBM Plex Mono',monospace !important}
  .ayuda{font:italic 400 11.5px Spectral,serif;color:var(--apagado);margin-top:5px}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  .toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .toggle button{font:600 12px Archivo,sans-serif;padding:11px;border:1.5px solid var(--campo);border-radius:9px;background:#fff;color:var(--tinta2);cursor:pointer}
  .toggle button.on{border-color:var(--teal2);background:#E4F2F2;color:var(--teal)}
  .tipos{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;margin-top:4px}
  .tipo{display:flex;gap:10px;align-items:flex-start;font:400 14px Spectral,serif;cursor:pointer}
  .tipo input{position:absolute;opacity:0;width:1px;height:1px}
  .caja{flex:none;width:18px;height:18px;border:1.5px solid var(--campo);border-radius:5px;background:#fff;margin-top:2px;display:flex;align-items:center;justify-content:center}
  .tipo input:checked + .caja{background:var(--teal);border-color:var(--teal)}
  .tipo input:checked + .caja::after{content:'';width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);margin-top:-2px}
  .tipo input:focus-visible + .caja{outline:2px solid var(--teal2);outline-offset:2px}
  .otros{display:flex;gap:10px;align-items:center;margin-top:14px} .otros span{font:600 12px Archivo,sans-serif}
  .zona{border:1px dashed #D8D3C5;background:#FBFAF6;border-radius:12px;padding:16px 18px}
  .zona .fila{display:flex;justify-content:space-between;gap:12px;align-items:center}
  .boton{font:600 12px Archivo,sans-serif;border:1.5px solid var(--campo);background:#fff;color:var(--teal);border-radius:8px;padding:9px 14px;cursor:pointer}
  .boton:hover{border-color:var(--teal2)}
  .archivo{display:flex;justify-content:space-between;gap:10px;font:400 13px Archivo,sans-serif;padding:8px 0;border-top:1px solid #F0EDE4;margin-top:8px}
  .archivo button{background:none;border:0;color:#B0483A;font:600 12px Archivo,sans-serif;cursor:pointer}
  .pie{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:22px;flex-wrap:wrap}
  .pie p{font:italic 400 12.5px/1.5 Spectral,serif;color:var(--apagado);max-width:330px;margin:0}
  .enviar{background:var(--teal);color:#fff;border:0;border-radius:9px;padding:13px 24px;font:700 13.5px Archivo,sans-serif;cursor:pointer}
  .enviar:hover{background:var(--naranja)} .enviar:disabled{opacity:.6;cursor:default;background:var(--teal)}
  .error{font:600 12px Archivo,sans-serif;color:#B0483A;background:#F9EBE8;border-radius:8px;padding:10px 12px;margin-top:16px;display:none}
  .ok{max-width:560px;margin:20px auto;background:#fff;border:1px solid var(--borde);border-top:4px solid #2F6B4F;border-radius:14px;padding:34px;text-align:center}
  .ok .pill{display:inline-block;font:600 10.5px Archivo,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#2F6B4F;background:#E7F3EB;border-radius:999px;padding:5px 12px}
  .ok .folio{font:600 64px/1 'IBM Plex Mono',monospace;margin:22px 0 6px}
  footer{border-top:1px solid var(--borde);padding:18px clamp(16px,5vw,60px);font:400 12px Archivo,sans-serif;color:var(--apagado);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
  @media (max-width:760px){ .g2,.tipos{grid-template-columns:1fr} input,select,button{min-height:44px} .marca img{height:48px} }
  input.fijo,input[readonly]{background:#EFECE4;color:var(--tinta2,#5A6470);cursor:not-allowed;border-style:dashed}
</style>
</head>
<body>
<header>
  <a class="marca" href="https://vipfahu.netlify.app">
    <img src="https://vipfahu.netlify.app/assets/logo-fahu.png" alt="Facultad de Humanidades USACH">
    <div><div class="tit">Concesiones Académicas de Excepción</div><div class="sub">Vicedecanato de Investigación y Postgrado · FAHU USACH</div></div>
  </a>
  <nav class="navp">
    <a class="act" href="<?= url ?>?v=solicitud">Nueva solicitud</a>
    <a href="<?= url ?>?v=seguimiento">Seguimiento</a>
    <a href="https://vipfahu.netlify.app">Portal VIP</a>
    <a class="discreto" href="<?= url ?>">Panel del equipo →</a>
  </nav>
</header>
<main id="app"><p class="nota">Cargando formulario…</p></main>
<footer><span>Vicedecanato de Investigación y Postgrado · Facultad de Humanidades · Universidad de Santiago de Chile</span><span>vipfahu.netlify.app</span></footer>

<script>
const URL_APP = '<?= url ?>';
const h = s => String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);
function run(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  return new Promise((ok, mal) => google.script.run.withSuccessHandler(ok).withFailureHandler(mal)[fn].apply(null, args));
}
const limpiarError = e => String(e && e.message || e).replace(/^Error:\s*/, '').replace(/^SIN_IDENTIDAD:\s*/, '');
let CFG = null, semestre = '', archivos = [];

run('api_inicioSolicitud').then(c => {
  CFG = c; semestre = c.semestre;
  if (!c.identidad) {
    $('app').innerHTML = '<div class="kicker">Estudiantes de postgrado FAHU e IDEA</div><h1>Formulario Concesión Académica de Excepción (CAE)</h1>' +
      '<div class="seccion" style="--c:#EF7A00"><p class="intro">Para presentar una solicitud debe ingresar con su cuenta <b>@usach.cl</b>. Cierre sesión de otras cuentas de Google o abra este enlace en una ventana privada e inicie sesión con su cuenta institucional.</p></div>';
    return;
  }
  pintar();
}).catch(e => { $('app').innerHTML = '<div class="error" style="display:block">No se pudo cargar el formulario: ' + h(limpiarError(e)) + '</div>'; });

function campo(id, rot, opts) {
  opts = opts || {};
  return '<div><label class="et" for="' + id + '">' + rot + ' <b>*</b></label><input id="' + id + '"' + (opts.mono ? ' class="mono"' : '') +
    (opts.ph ? ' placeholder="' + h(opts.ph) + '"' : '') + (opts.val ? ' value="' + h(opts.val) + '"' : '') + (opts.tipo ? ' type="' + opts.tipo + '"' : '') + (opts.fijo ? ' readonly aria-readonly="true" class="fijo"' : '') + ' autocomplete="' + (opts.ac || 'off') + '">' +
    (opts.ayuda ? '<div class="ayuda">' + opts.ayuda + '</div>' : '') + '</div>';
}

function pintar() {
  $('app').innerHTML =
    '<div class="kicker">Estudiantes de postgrado FAHU e IDEA</div>' +
    '<h1>Formulario Concesión Académica de Excepción (CAE)</h1>' +
    '<p class="intro">Este formulario ha sido diseñado para canalizar las solicitudes académicas de excepción de estudiantes de postgrado de la Facultad de Humanidades y del Instituto de Estudios Avanzados de la Universidad de Santiago de Chile.</p>' +
    '<p class="nota">Al enviar recibirá un correo de confirmación con su número de folio y un enlace para seguir el estado del trámite. Los campos marcados con <span style="color:var(--naranja)">*</span> son obligatorios. Ingresó como <b class="mono" style="font-size:12px">' + h(CFG.correo) + '</b>.</p>' +

    '<section class="seccion" style="--c:#00A0A0"><h2>Datos de la persona solicitante <span>01</span></h2><div class="desc">Por favor, complete datos relativos a la persona que realiza la solicitud.</div>' +
      '<div class="g2">' + campo('apellido1', 'Primer apellido', { ac: 'family-name' }) + campo('apellido2', 'Segundo apellido') + '</div>' +
      campo('nombres', 'Nombres', { ac: 'given-name' }) +
      '<div class="g2">' + campo('run', 'RUN o pasaporte', { mono: true, ph: '12.345.678-9' }) + campo('telefono', 'Teléfono de contacto', { mono: true, ph: '+56 9 …', tipo: 'tel', ac: 'tel' }) + '</div>' +
      campo('correo', 'Correo electrónico', { val: CFG.correo, tipo: 'email', ac: 'email', fijo: true, ayuda: 'Es la cuenta USACH con que ingresó; no se puede modificar. A este correo llegarán las notificaciones del trámite y con esta cuenta podrá ver el seguimiento en línea. Si necesita usar otra cuenta, cierre sesión e ingrese con ella.' }) +
    '</section>' +

    '<section class="seccion" style="--c:#EF7A00"><h2>Datos de requerimiento <span>02</span></h2><div class="desc">Por favor, detalle el requerimiento que realiza.</div>' +
      '<label class="et" for="programa">Programa de postgrado en que participa <b>*</b></label><select id="programa"><option value="">Seleccione un programa…</option>' +
        CFG.programas.map(p => '<option>' + h(p) + '</option>').join('') + '</select>' +
      '<div class="g2"><div><label class="et" for="anio">Año asociado a la solicitud <b>*</b></label><input id="anio" class="mono" type="number" min="' + (CFG.anio - 1) + '" max="' + (CFG.anio + 1) + '" value="' + CFG.anio + '"></div>' +
        '<div><label class="et">Semestre asociado <b>*</b></label><div class="toggle" id="semestre"><button type="button" data-s="Semestre I">Semestre I</button><button type="button" data-s="Semestre II">Semestre II</button></div></div></div>' +
      '<label class="et">Solicito autorización para <b>*</b></label><div class="tipos">' +
        CFG.tipos.map((t, i) => '<label class="tipo"><input type="checkbox" class="tp" value="' + h(t) + '"><span class="caja"></span>' + h(t) + '</label>').join('') + '</div>' +
      '<div class="otros"><span>Otros:</span><input id="otro" placeholder="Describa brevemente"></div>' +
      '<label class="et" for="fundamentacion">Fundamentación <b>*</b></label><textarea id="fundamentacion" rows="7" placeholder="Relate los antecedentes o integre los argumentos que se asocian a la solicitud de excepción."></textarea>' +
      '<label class="et">Adjuntar antecedentes</label><div class="zona"><div class="fila"><div class="nota" style="margin:0">Hasta ' + CFG.maxArchivos + ' archivos (PDF, Word, imágenes o .zip), máximo ' + CFG.maxMbArchivo + ' MB cada uno y ' + CFG.maxMbTotal + ' MB en total.</div>' +
        '<button type="button" class="boton" id="agregar">⤒ Agregar archivo</button><input type="file" id="archivo" style="display:none"></div><div id="lista"></div></div>' +
    '</section>' +

    '<div class="error" id="error" role="alert"></div>' +
    '<div class="pie"><p>Los datos se tratan de forma confidencial y solo son visibles para el Vicedecanato y las personas que intervienen en el trámite.</p><button class="enviar" id="enviar">Enviar solicitud</button></div>';

  pintarSemestre();
  $('semestre').querySelectorAll('button').forEach(b => b.onclick = () => { semestre = b.dataset.s; pintarSemestre(); });
  $('agregar').onclick = () => $('archivo').click();
  $('archivo').onchange = agregarArchivo;
  $('enviar').onclick = enviar;
}
function pintarSemestre() { $('semestre').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.s === semestre)); }
function pintarLista() {
  $('lista').innerHTML = archivos.map((a, i) => '<div class="archivo"><span>' + h(a.nombre) + ' <span class="sub">(' + a.mb.toFixed(1) + ' MB)</span></span><button type="button" data-i="' + i + '">Quitar</button></div>').join('');
  $('lista').querySelectorAll('[data-i]').forEach(b => b.onclick = () => { archivos.splice(Number(b.dataset.i), 1); pintarLista(); });
  $('agregar').style.display = archivos.length >= CFG.maxArchivos ? 'none' : '';
}
function mostrarError(msg) { const e = $('error'); e.textContent = msg; e.style.display = msg ? 'block' : 'none'; if (msg) e.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
function agregarArchivo() {
  const f = $('archivo').files[0]; $('archivo').value = '';
  if (!f) return;
  const mb = f.size / 1048576, total = archivos.reduce((s, a) => s + a.mb, 0) + mb;
  if (mb > CFG.maxMbArchivo) return mostrarError('«' + f.name + '» pesa ' + mb.toFixed(1) + ' MB; el máximo por archivo es ' + CFG.maxMbArchivo + ' MB. Si son varios documentos, comprímalos en un .zip.');
  if (total > CFG.maxMbTotal) return mostrarError('Los archivos sumarían ' + total.toFixed(1) + ' MB; el máximo es ' + CFG.maxMbTotal + ' MB.');
  mostrarError('');
  archivos.push({ file: f, nombre: f.name, mb: mb });
  pintarLista();
}
function leerBase64(f) {
  return new Promise((ok, mal) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.onerror = () => mal(new Error('No se pudo leer «' + f.name + '».')); r.readAsDataURL(f); });
}
async function enviar() {
  const d = {
    apellido1: $('apellido1').value, apellido2: $('apellido2').value, nombres: $('nombres').value, run: $('run').value,
    telefono: $('telefono').value, correo: $('correo').value, programa: $('programa').value, anio: $('anio').value,
    semestre: semestre, tipos: [...document.querySelectorAll('.tp:checked')].map(x => x.value), otro: $('otro').value,
    fundamentacion: $('fundamentacion').value
  };
  // Validación rápida en el navegador; el servidor vuelve a validar todo.
  const faltan = [['apellido1', 'primer apellido'], ['apellido2', 'segundo apellido'], ['nombres', 'nombres'], ['run', 'RUN o pasaporte'], ['telefono', 'teléfono'], ['correo', 'correo'], ['programa', 'programa'], ['fundamentacion', 'fundamentación']]
    .filter(x => !String(d[x[0]]).trim()).map(x => x[1]);
  if (faltan.length) return mostrarError('Complete: ' + faltan.join(', ') + '.');
  if (!d.tipos.length && !d.otro.trim()) return mostrarError('Indique al menos una autorización solicitada o complete «Otros».');
  mostrarError('');
  const b = $('enviar'); b.disabled = true;
  try {
    const ids = [];
    for (let i = 0; i < archivos.length; i++) {
      b.textContent = 'Subiendo archivo ' + (i + 1) + ' de ' + archivos.length + '…';
      const a = archivos[i];
      if (!a.id) { const r = await run('api_subirAntecedente', a.nombre, a.file.type, await leerBase64(a.file)); a.id = r.id; }
      ids.push(a.id);
    }
    b.textContent = 'Enviando solicitud…';
    const r = await run('api_enviarSolicitud', d, ids);
    confirmar(r);
  } catch (e) {
    mostrarError(limpiarError(e)); b.disabled = false; b.textContent = 'Enviar solicitud';
  }
}
function confirmar(r) {
  window.scrollTo(0, 0);
  $('app').innerHTML = '<div class="ok"><span class="pill">Solicitud recibida</span><div class="folio">' + h(r.folio) + '</div>' +
    '<div class="kicker" style="color:var(--apagado)">Número de folio</div>' +
    '<p class="intro" style="margin:18px 0 24px">Enviamos la confirmación a <b>' + h(r.correo) + '</b>. Guarde su número de folio: con él y su cuenta USACH puede seguir el estado del trámite.</p>' +
    '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><a class="enviar" style="text-decoration:none" href="' + h(URL_APP) + '?v=seguimiento">Seguir mi solicitud</a>' +
    '<a class="boton" style="text-decoration:none;padding:13px 20px" href="' + h(URL_APP) + '?v=solicitud">Nueva solicitud</a></div></div>';
}
</script>
</body>
</html>
